name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: build and offline tests (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --filter "Category!=ExternalService"

  live:
    name: live PRIDE canaries (not required; skipped on an outage)
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --filter "Category=ExternalService"

name: CI

# Runs when something the build or the tests read changes (2026-10-21): most pushes are notes and messages no test
# reads, and each one ran both jobs. The live canaries reach PRIDE, so they run weekly and on demand only.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "profiles/**"
      - "examples/**"
      - "machines/**"
      - "PXReprise.slnx"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "profiles/**"
      - "examples/**"
      - "machines/**"
      - "PXReprise.slnx"
      - ".github/workflows/**"
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

# A newer push to the same branch stops the run it supersedes (2026-10-25, the user: CI minutes on the private repo).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and offline tests (required)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --filter "Category!=ExternalService"

  live:
    name: live PRIDE canaries (not required; skipped on an outage)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --filter "Category=ExternalService"

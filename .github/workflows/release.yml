name: Release

# A release is a tag on master: v<version>, where <version> is src/PXReprise/PXReprise.csproj's <Version> and CHANGELOG.md has a
# dated section for it ("## 0.4.48 (2026-11-20)"). The version bump and the dated CHANGELOG go in by pull request first. Then
# an admin pushes the tag (git tag v0.4.48 && git push upstream v0.4.48), or runs this workflow by hand with the version, which
# tags master's head. GitHub builds and tests that commit and publishes the release with the CHANGELOG section as its notes.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from master's head, without the v (must equal the csproj <Version>)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which version and commit
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"; git checkout -q origin/master
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The commit is on master, and the csproj and CHANGELOG agree with the version
        run: |
          v="${{ steps.v.outputs.version }}"
          git merge-base --is-ancestor HEAD origin/master || { echo "::error::$(git rev-parse --short HEAD) is not on master"; exit 1; }
          csproj=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PXReprise/PXReprise.csproj | head -1)
          [ "$csproj" = "$v" ] || { echo "::error::the csproj says $csproj, the release says $v"; exit 1; }
          grep -qE "^## ${v//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated section for $v"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::v$v is already tagged"; exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --filter "Category!=ExternalService"
      - name: Release notes from the CHANGELOG section
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v h="## $v (" 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::the CHANGELOG section for $v is empty"; exit 1; }
      - name: Tag (when run by hand) and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag "v$v" "${{ steps.v.outputs.sha }}" && git push origin "refs/tags/v$v"
          fi
          gh release create "v$v" --title "PXReprise $v" --notes-file notes.md --verify-tag

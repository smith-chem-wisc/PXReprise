# The push-time check that both programs of a PXReprise release still build and run on every platform (decision 0073).
#
# A thin caller of binaries.yml, the steps release.yml runs for a release: the engine and datarepo, published
# self-contained for win-x64, linux-x64, osx-arm64 and osx-x64, each run with no .NET SDK on PATH (datarepo ingests the
# fixture dataset, builds a catalog, answers a query and writes the site), packaged, unpacked and run again. The archives
# are uploaded as workflow artifacts. They are stamped 0.0.0-dev, which is never a release (`datarepo run` refuses it).
#
# There is ONE release and ONE version: a v<version> tag (release.yml) publishes both programs. datarepo has no version of
# its own, so this workflow no longer releases anything, and the datarepo-v* tags ended with 1.5.0. (Since 2026-11-13
# dataRepo lives in PXReprise; this workflow was dataRepo's dotnet-binaries.yml.)
name: datarepo-binaries

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/PXReprise/**"
      - "src/PXReprise.Bundle/**"
      - "src/PXReprise.Catalog/**"
      - "src/PXReprise.DataCli/**"
      - "src/PXReprise.Ingest/**"
      - "src/PXReprise.Mcp/**"
      - "src/PXReprise.Runner/**"
      - "src/PXReprise.SchemaGen/**"
      - "src/PXReprise.Site/**"
      - "src/PXReprise.Storage/**"
      - "src/PXReprise.Study/**"
      - "src/Data.Build.props"
      - "profiles/**"
      - "tests/datarepo-instance/**"
      - "schemas/datarepo/**"
      - ".github/workflows/datarepo-binaries.yml"
      - ".github/workflows/binaries.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/binaries.yml

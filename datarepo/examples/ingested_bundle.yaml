definitions:
- definition_id: aging:DEF-PSM-1PCT
  version: v1
  owner_project: aging
  text: 'Target PSMs at 1% FDR, as MetaMorpheus''s results.txt summary line reports them: ''All target
    PSMs with q-value <= 0.01''. Target PSMs only. This is the canonical PSM count. Four conditions, all
    required (aging thread 011): Decoy/Contaminant/Target == ''T'', QValue <= 0.01, QValue Notch <= 0.01,
    and notch_ambiguous == false (aging:DEF-PSM-NOTCH-AMBIGUOUS). The fourth is not inferable from the
    written file alone, which is why a count taken without it comes out high.'
- definition_id: aging:DEF-PSM-NOTCH-AMBIGUOUS
  version: v1
  owner_project: aging
  text: A PSM is notch-ambiguous when the Notch cell of AllPSMs.psmtsv contains a '|' separator, i.e.
    MetaMorpheus wrote more than one notch hypothesis for the match. For such a PSM, SpectralMatch.ResolveAllAmbiguities
    leaves the in-memory PsmFdrInfo.QValueNotch unresolved at > 1, while PsmTsvWriter.AddMatchScoreData
    writes the MINIMUM notch q-value across hypotheses. The written 'QValue Notch' can therefore pass
    a threshold the counted one fails, which is why aging:DEF-PSM-1PCT needs this condition as well as
    the two q-values.
- definition_id: aging:DEF-PSM-FDRENGINE
  version: v1
  owner_project: aging
  text: PSMs within 1% FDR as MetaMorpheus's FDR engine logs them. Higher than DEF-PSM-1PCT; it appears
    to include contaminant PSMs. In aging-provenance/2 and earlier this is the number stored as id_rate.psms_1pct,
    which is why the provenance field name cannot be trusted alone.
- definition_id: aging:DEF-ID-RATE
  version: v1
  owner_project: aging
  text: 'Identified fraction of MS2 spectra, as the pipeline records it in provenance id_rate.rate: the
    stage''s PSM count over the MS2 count. Which PSM count it uses follows the provenance schema version
    (DEF-PSM-FDRENGINE in /2 and earlier).'
- definition_id: QuantProject:DEF-QC-MBR
  version: v1
  owner_project: QuantProject
  text: 'Match-between-runs quality block as the pipeline records it: rows attempted, rows kept at the
    MBR FDR threshold, MS/MS-anchored peaks, and the kept-over-MSMS ratio. Copied from the provenance
    record that names this definition.'

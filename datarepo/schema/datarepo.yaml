# dataRepo core schema, v0 (DRAFT, 2026-09-19). Not locked: FRAMEWORK.md (G1) is still a proposal.
#
# Scope rule (U5 default, G10): this core knows nothing about aging. It holds the search + quant
# results of any bottom-up reanalysis of public proteomics datasets. A study layer (e.g.
# schema/study/aging.yaml) ADDS tables keyed on core identifiers and never alters a core table.
#
# Rules carried from aging and FRAMEWORK §3:
#   - Missing is NA, never 0. A 0 is stored only where its definition makes 0 a measurement (a count).
#   - Every stored number that has a producer-defined meaning carries a definition_id (owner's DEF-*).
#   - One peptidoform notation everywhere: ProForma 2 with UNIMOD accessions.
#   - Format is a QPX-compatible superset (D4). `qpx_view` annotations mark the tables that map to a
#     QPX view. Column-level QPX mapping is NOT yet checked against a QPX release; see design/SCHEMA_V0.md.
#   - Scope columns are real columns from v0 (D5, DATAREPO-2): organism, acquisition, quant_method,
#     labelling, enrichment, instrument_vendor.
#   - dataRepo stores; it never computes science. Tables marked `producer` are filled from that
#     project's output as-is.

id: https://w3id.org/datarepo/core
name: datarepo
title: dataRepo core schema
version: 0.0.11
license: https://creativecommons.org/licenses/by/4.0/
description: >-
  Generic core schema for an AI-ready repository of reanalyzed public proteomics datasets:
  datasets, samples, runs, PSMs, peptidoforms, protein groups, PTM sites and stoichiometry,
  glycopeptides, inferred proteoforms, long-format quantities, annotations, definitions,
  provenance and releases.

prefixes:
  linkml: https://w3id.org/linkml/
  datarepo: https://w3id.org/datarepo/core/
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  CL: http://purl.obolibrary.org/obo/CL_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  EFO: http://identifiers.org/efo/
  PATO: http://purl.obolibrary.org/obo/PATO_
  GO: http://purl.obolibrary.org/obo/GO_
  UNIMOD: http://identifiers.org/unimod/
  MS: http://purl.obolibrary.org/obo/MS_
  uniprot: http://purl.uniprot.org/uniprot/
  pride: https://www.ebi.ac.uk/pride/archive/projects/

default_prefix: datarepo
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------------------------
enums:
  Acquisition:
    description: "MS acquisition mode."
    permissible_values:
      DDA:
      DIA:
      PRM:
      mixed:
  QuantMethod:
    description: How abundance is read out. The reagent detail goes in `labelling`.
    permissible_values:
      label_free:
      isobaric:
        description: TMT, iTRAQ.
      metabolic:
        description: SILAC, 15N, NeuCode.
      none:
        description: Identification only.
  Labelling:
    description: Label reagent (aging 003 axis). `TMT` carries its plex in Dataset.labelling_plex.
    permissible_values:
      none:
      SILAC:
      pulse_SILAC:
      N15:
      NeuCode:
      TMT:
      iTRAQ:
  Enrichment:
    description: >-
      Enrichment before MS (aging 003 axis). A dataset can have several. The PTM values describe
      what was enriched; the four capture values (DATAREPO-34, aging 046) describe HOW proteins were
      captured, which is what decides whether intensities can be read as whole-cell abundance.
      An enrichment is not excluded from organelle questions -- a LAMP1-TurboID pulldown is a
      lysosome proteome -- but it must never be pooled with, or read as, a whole proteome.
      Where the bait sits (an organelle) is NOT an enrichment value.
    permissible_values:
      none:
        description: Whole proteome; no enrichment step.
      phospho:
      acetyl:
      ubiquitin_GG:
      succinyl:
      glyco:
      immunoprecipitation:
        description: Antibody capture of a bait -- IP, co-IP, IP-MS, including IgG control IPs.
      proximity_labelling:
        description: BioID, TurboID, APEX2 and similar, followed by streptavidin capture.
      affinity_purification:
        description: Tagged-bait or matrix capture without an antibody -- GFP-trap, FLAG, pulldowns.
      chemical_probe:
        description: Kinobeads and other small-molecule affinity matrices.
      other:
        description: An enrichment none of the above names; the manifest's note says which.
  RunEnrichmentSource:
    description: >-
      Where a run's `enrichment` came from (G63, aging DATAREPO-39/DATAREPO-44). A run whose value is
      NULL has no source and no row here says otherwise: NULL means nobody told us, never "whole
      proteome".
    permissible_values:
      dataset_declaration:
        description: >-
          The dataset's own `enrichment`, copied to every run. Only when the producer has NOT flagged
          the dataset `mixed_enrichment`, so the declaration is true of every run.
      manifest_run_enrichment:
        description: >-
          The producer's per-run map (`run_enrichment` in the instance manifest), curated by the
          producer from the deposit's protocol. It must cover every run or the ingest refuses.
  SdrfStatus:
    description: How far the dataset's SDRF could be trusted (P4).
    permissible_values:
      trusted:
      repaired:
      config_fallback:
        description: No usable SDRF; design came from the pipeline's config.
      absent:
  ModUsage:
    description: How a modification entered the search (P1).
    permissible_values:
      fixed:
      variable:
      gptmd:
        description: Candidate list for GPTMD discovery.
      glycan:
  MetricScope:
    description: "What a Metric row is about."
    permissible_values:
      dataset:
      run:
  AxisSource:
    description: Where a dataset-axis value came from, until aging's provenance carries it (DATAREPO-2).
    permissible_values:
      provenance:
        description: Written explicitly by the producing pipeline. The target state.
      sdrf:
      discover:
        description: Inferred from PRIDE metadata at discovery.
      curated:
  SiteType:
    description: >-
      Where on the molecule a modification sits. Ruled by aging 024 section 4, which is the same
      ruling they gave QuantProject in their 020, so it costs no new concept. A `site_type` rather
      than a positional convention (position = 0 for a terminus, say) because a protein N-terminal
      acetylation and an N6-acetyllysine on residue 1 are DIFFERENT CHEMISTRIES AT THE SAME
      COORDINATE, and a key that cannot separate them will eventually merge them.
    permissible_values:
      residue:
        description: >-
          An internal residue. The default, and what almost every row is.
      protein_n_term:
        description: >-
          The protein's own N-terminus. Includes the case where the initiator methionine was
          cleaved and the modification sits on residue 2 -- which is the COMMON case, not an edge
          case: co-translational N-terminal acetylation follows Met excision, so a rule of
          "peptide starts at residue 1" would mislabel the most abundant terminal chemistry in
          the proteome as peptide_n_term. dataRepo derives this from the producer's own
          `previous_residue` and peptide description rather than from the position alone.
      protein_c_term:
        description: >-
          The protein's own C-terminus: the peptide's last residue is the protein's last residue
          in the searched sequence. Keyed on that residue at its own position, never on protein
          length + 1 (aging 045 section 2, DATAREPO-33).
      peptide_n_term:
        description: >-
          The N-terminus of this peptide, which is an internal position in the protein -- a
          cleavage artefact position, not a protein terminus. Ammonia loss on a peptide's first
          residue is the common case.
      peptide_c_term:
        description: >-
          The C-terminus of this peptide, internal to the protein. Typed against the searched
          sequence; a C-terminal modification on a protein with no sequence is not written and is
          counted in the dataset's `unplaced_ptm_sites` finding instead.
  TargetDecoy:
    description: "Target/decoy/contaminant status of a match."
    permissible_values:
      target:
      decoy:
      contaminant:
  DetectionType:
    description: "How a quantity was obtained."
    permissible_values:
      MSMS:
      MBR:
      imputed:
        description: Never produced by dataRepo; allowed only if a producer writes it and marks it.
      not_detected:
  FeatureType:
    description: What a QuantValue or effect row is about.
    permissible_values:
      peptidoform:
      protein_group:
      ptm_site:
      ptm_site_canonical:
        description: >-
          A site named the same way in every dataset of one species, for pooled results:
          `<accession>:<residue><position>:<UNIMOD accession, or the engine's name when there is none>`.
          Not a `ptm_site_id` (which is per dataset); join it to `ptm_sites` on accession, position
          and modification.
      glycopeptide:
      proteoform:
      protein:
  OccupancyGrouping:
    description: >-
      What an occupancy denominator was accumulated over (QuantProject DEF-OCC-GROUPING). Nothing in
      MetaMorpheus's file says which, so the row must: two generations of one definition, before and
      after a design file, are not comparable.
    permissible_values:
      run: {description: "One raw file. MetaMorpheus with no experimental design makes each file its own sample group."}
      sample_group: {description: "A design's (condition, biological replicate), pooling its fractions and technical replicates."}
  OccupancyState:
    description: >-
      Which of QuantProject's states a stored occupancy observation is in (DEF-OCC-COUNTONLY). The
      fourth state, absent (no modified form seen), is no row at all (DEF-OCC-ABSENT) and never 0.
    permissible_values:
      quantified: {description: "A count entry and an intensity entry with a non-zero numerator: a measurement."}
      floor: {description: "An intensity entry of fraction 0 with numerator 0: the modified form was identified but never quantified, while covering forms were. CENSORED low, not a measured zero (DEF-OCC-INT-ZERO)."}
      count_only: {description: "A count entry and no intensity entry: nothing covering the site was quantified in this run. The intensity columns are NULL, never 0."}
      intensity_unassigned: {description: "A count entry, and the run's intensity cell for this group EXISTS but its segments could not be assigned to accessions from the sequences (DEF-OCC-ACCESSION). The intensity columns are NULL because the value is unknown, not because nothing was quantified; an occupancy_not_stored finding counts the entries."}
  GeneResolutionOutcome:
    description: >-
      What logs' gene resolution found for one protein (mzLib `EnsemblGeneResolver`, pyMzLib
      `proteins.OUTCOMES`). The six values are mzLib's own and are stored as it writes them.
    permissible_values:
      resolved: {description: "Exactly one gene on the pinned gene set's assembly."}
      multi_gene: {description: "Several genes on the assembly; one row per gene, never a pick."}
      off_primary_only: {description: "Genes linked, but only outside the gene set (ALT haplotypes, patches)."}
      not_in_source: {description: "The database entry links no Ensembl gene."}
      unrecognized_accession: {description: "The accession is not UniProt or RefSeq shaped."}
      contaminant_not_mapped: {description: "A contaminant protein, never mapped through anything."}
  PairResultType:
    description: "What kind of relationship a ptm_pairs row reports (ptmQtl 002 section 5)."
    permissible_values:
      P:
        description: Physical co-occurrence -- both modifications on the same peptidoform.
      C:
        description: Both co-vary with the trait.
      A:
        description: Residual correlation after the trait is accounted for.
      B:
        description: Stratified or differential -- the relationship differs between strata. The only type with a stratum.
  PairFlag:
    description: "Structural facts about a pair that change how it may be read."
    permissible_values:
      overlapping:
        description: The two peptidoforms overlap in sequence or site. Excluded from A and B, where the unmodified form would anti-correlate with its own modified form by construction.
      same_residue_exclusive:
        description: The two modifications compete for one residue, e.g. O-GlcNAc versus phospho.
  GlycanType:
    description: "Glycan linkage class."
    permissible_values:
      N:
      O:
      N_and_O:
        description: One peptide carrying both (combined N+O search).
  GlycoLocalizationLevel:
    description: MetaMorpheus O-Pair style levels; confirm names with the producer (R16).
    permissible_values:
      level_1:
      level_1b:
      level_2:
      level_3:
  Severity:
    description: "How much a Finding should change trust."
    permissible_values:
      info:
      warning:
      error:
  FindingStatus:
    description: "Lifecycle of a Finding."
    permissible_values:
      open:
      resolved:
      wont_fix:
  ChangeType:
    description: "Kind of change recorded in a ReleaseChange."
    permissible_values:
      added:
      removed:
      reprocessed:
      annotation_updated:
      schema_changed:

# ---------------------------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------------------------
classes:

  # ---- releases & catalog -------------------------------------------------------------------
  Release:
    description: One immutable, citable release (D2). R2.
    attributes:
      release_id: {identifier: true, description: "Semantic version, e.g. 0.1.0."}
      date: {range: date, required: true, description: "Date the release was frozen."}
      doi: {range: uriorcurie, description: "DOI minted for this release (Zenodo by default)."}
      schema_version: {required: true, description: "Version of this schema the release conforms to."}
      qpx_version: {description: "QPX release this bundle is compatible with (D4).", required: true}
      notes: {description: "Free-text release notes."}

  ReleaseChange:
    description: "Changelog row: what changed for one dataset between releases (R2, question A7)."
    attributes:
      release_id: {range: Release, required: true, description: "Release this row belongs to."}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      change_type: {range: ChangeType, required: true, description: "Kind of change."}
      reason: {required: true, description: "Why the dataset changed in this release."}

  DatasetCandidate:
    description: >-
      Discovery census row: every screened accession with its inclusion verdict (R1). Producer:
      the reanalysis project (aging). Answers "why is PXDn not here?".
    attributes:
      census_version: {required: true, description: "Version of the discovery census this row belongs to."}
      accession: {required: true, pattern: "^(PXD|MSV|JPST|IPX)[0-9]+$", description: "Screened ProteomeXchange accession."}
      included: {range: boolean, required: true, description: "True if the accession passed every gate and was reanalyzed."}
      exclusion_reason: {description: "Gate that excluded it (e.g. spectra gate: not HCD Orbitrap)."}
      definition_id: {range: Definition, description: "Definition of the gate that decided inclusion."}

  Dataset:
    description: One reanalyzed public dataset.
    annotations: {qpx_view: dataset}
    attributes:
      dataset_id: {identifier: true, pattern: "^(PXD|MSV|JPST|IPX)[0-9]+$", description: "ProteomeXchange accession, e.g. PXD036557."}
      title: {description: "Title from the archive."}
      organisms: {range: uriorcurie, multivalued: true, required: true, description: "NCBITaxon IDs of the protein DATABASE the search used, as the producer declares it. Not a statement about the samples: PXD050351's title says mice and it is a human cell line, and this field can say only which proteome was searched (aging 070 57g). Sample annotation, where any exists, is in `samples` and `sample_characteristics`."}
      acquisition: {range: Acquisition, required: true, description: "Acquisition mode."}
      quant_method: {range: QuantMethod, required: true, description: "Quantification principle."}
      labelling: {range: Labelling, required: true, description: "Label reagent, if any."}
      labelling_plex: {range: integer, description: "e.g. 16 for TMTpro 16-plex."}
      enrichment: {range: Enrichment, multivalued: true, required: true, description: "Enrichment steps before MS; [none] for whole proteome. The producer's DECLARATION of what the deposit is (aging's S15), not a union of run values: [none, chemical_probe] would read as two steps in sequence. Where runs differ, `enrichment_mixed` is true and each run's own steps are `runs.enrichment`."}
      enrichment_mixed: {range: boolean, required: true, description: "True when this dataset's runs do not all share one enrichment: the producer flagged it `mixed_enrichment`, or the per-run values carry more than one distinct set. An enrichment question on a mixed dataset has to be answered per run (`runs.enrichment`), never from `enrichment` above. Derived at ingest (G63)."}
      instrument_vendor: {description: "Instrument vendor, e.g. Thermo, Bruker, SCIEX."}
      instruments: {multivalued: true, description: "PSI-MS instrument names or IDs."}
      permitted_responses: {multivalued: true, description: "Which kinds of measurement this dataset MAY be used for -- an ALLOW-LIST, not a bar (aging 024 section 7). Empty means unrestricted. A deny-list fails open: a response type added later would be silently permitted on a dataset nobody re-examined, so a restriction is stated positively and a new response is excluded until someone says otherwise. The motivating case is PXD060431, whose low-resolution MS2 costs fragment mass accuracy and so bars it from `ptm_stoichiometry` and `ptm_site_localization` while leaving abundance sound (aging D24): `permitted_responses: [abundance]`. It is a real column rather than a `flags` string because a restriction a query cannot honour without parsing prose is not a restriction. The vocabulary is the producing instance's, not an enum here -- the core knows nothing about any one study (U5), and a study layer's own response values must be a subset of what this permits."}
      axis_source: {range: AxisSource, required: true, description: "Where the six axes above came from."}
      submission_type: {description: "Archive submission type (COMPLETE, PARTIAL)."}
      search_engine: {required: true, description: "Search engine used for the reanalysis."}
      search_engine_version: {required: true, description: "Exact search-engine version."}
      search_database: {description: "Protein database name and release, e.g. UniProt human reviewed 2026_03 + isoforms (G10)."}
      search_database_sha256: {description: "SHA-256 of the protein database file searched."}
      sdrf_status: {range: SdrfStatus, description: "Whether the SDRF was trusted, repaired or replaced."}
      pipeline_repo: {description: "Repository of the pipeline that produced it."}
      pipeline_commit: {description: "Git commit of the pipeline that produced it."}
      searches: {multivalued: true, description: "Search kinds run on this dataset: standard, gptmd, glyco_N, glyco_O, glyco_NO."}
      first_release_id: {range: Release, description: "Release in which the dataset first appeared."}
      latest_release_id: {range: Release, description: "Most recent release that changed the dataset."}

  Sample:
    description: >-
      One biological sample, from the SDRF. Generic columns only. Study-specific columns (e.g. age)
      live in study-layer tables keyed on sample_id.
    annotations: {qpx_view: sample}
    attributes:
      sample_id: {identifier: true, description: "<dataset_id>:<SDRF source name>"}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      source_name: {required: true, description: "SDRF source name. Also the donor key for longitudinal designs (R10)."}
      organism: {range: uriorcurie, required: true, description: "NCBITaxon term of the sample's organism."}
      sex: {range: uriorcurie, description: "PATO term. NULL whenever the SDRF cell gives a NAME without an ontology term, which is the common case (PXD026608 says 'heart', PXD011314 'Blood'): NULL here is NOT 'not recorded'. The verbatim cell is in `sample_characteristics`; read it before concluding a sample has no sex."}
      organism_part: {range: uriorcurie, description: "UBERON term. NULL whenever the SDRF cell gives a NAME without an ontology term, which is the common case (PXD026608 says 'heart', PXD011314 'Blood'): NULL here is NOT 'not recorded'. The verbatim cell is in `sample_characteristics`; read it before concluding a sample has no tissue."}
      cell_type: {range: uriorcurie, description: "CL term. NULL whenever the SDRF cell gives a NAME without an ontology term, which is the common case (PXD026608 says 'heart', PXD011314 'Blood'): NULL here is NOT 'not recorded'. The verbatim cell is in `sample_characteristics`; read it before concluding a sample has no cell type."}
      disease: {range: uriorcurie, description: "MONDO or EFO term; PATO:0000461 for normal. NULL whenever the SDRF cell gives a NAME without an ontology term, which is the common case (PXD026608 says 'heart', PXD011314 'Blood'): NULL here is NOT 'not recorded'. The verbatim cell is in `sample_characteristics`; read it before concluding a sample has no disease."}
      condition: {description: "Free-text condition, e.g. HGPS, caloric restriction (B7, I4)."}
      material_type: {description: "SDRF material type: tissue, cell culture, body fluid… (B8)."}
      cell_line: {description: "Cell line name, for cell-culture samples."}
      individual_id: {description: "SDRF characteristics[individual]. Same donor across samples = longitudinal (B11, R10)."}
      biological_replicate: {range: integer, description: "Biological replicate number from the SDRF."}
      timepoint: {description: "Longitudinal timepoint label if the SDRF has one (R10)."}

  SampleCharacteristic:
    description: Every SDRF characteristic, kept verbatim, so nothing is lost to the curated columns.
    attributes:
      sample_id: {range: Sample, required: true, description: "Sample this row describes."}
      name: {required: true, description: "SDRF column, e.g. characteristics[age]."}
      value: {required: true, description: "Value as written in the SDRF."}
      term: {range: uriorcurie, description: "Ontology term for the value, where the SDRF gives one."}

  Run:
    description: One raw file.
    annotations: {qpx_view: run}
    attributes:
      run_id: {identifier: true, description: "<dataset_id>:<file name without extension>"}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      file_name: {required: true, description: "Raw file name as deposited."}
      sha256: {description: "SHA-256 of the file that was searched."}
      pride_checksum_sha1: {description: "Checksum published by the archive, for comparison with sha256 (F6)."}
      fraction: {range: integer, description: "Fraction identifier from the SDRF."}
      technical_replicate: {range: integer, description: "Technical replicate number."}
      fragmentation: {multivalued: true, description: "HCD, EThcD, ETD… (T10)."}
      ms2_spectra: {range: integer, description: "Number of MS2 spectra in the file."}
      run_minutes: {range: float, description: "Acquisition length in minutes."}
      qc_pass: {range: boolean, description: "Whether the run passed the producer's spectra QC gate."}
      instrument_model: {description: "Instrument model from the raw file header."}
      acquisition_datetime: {range: datetime, description: "From the raw file header (J14 batch/date checks, H4)."}
      enrichment: {range: Enrichment, multivalued: true, description: "Enrichment steps before MS for THIS run (G63): an enrichment is done to what was injected, so it belongs on the run. [none] means whole proteome. NULL means unknown -- a dataset the producer flagged `mixed_enrichment` with no per-run source gets NULL on every run, never the dataset value, which is only true of some of them. Every value other than `none` appears in the dataset's `enrichment` declaration, or the ingest refuses."}
      enrichment_source: {range: RunEnrichmentSource, description: "Where `enrichment` came from. NULL exactly when `enrichment` is NULL."}

  Assay:
    description: >-
      One (run, channel) measurement of one sample. Label-free: one assay per run, channel
      "label_free". TMT: one per reporter channel. The unit every quantity attaches to (D5).
    attributes:
      assay_id: {identifier: true, description: "<run_id>:<channel>"}
      run_id: {range: Run, required: true, description: "Raw file this row belongs to."}
      channel: {required: true, description: "label_free, or the reporter / label channel (e.g. TMT126)."}
      sample_id: {range: Sample, required: true, description: "Sample measured in this assay."}

  # ---- identifications ----------------------------------------------------------------------
  Psm:
    description: One peptide-spectrum match.
    annotations: {qpx_view: psm}
    attributes:
      psm_id: {identifier: true, description: "<run_id>:<scan>:<rank>"}
      run_id: {range: Run, required: true, description: "Raw file this row belongs to."}
      scan: {range: integer, required: true, description: "Scan number of the MS2 spectrum."}
      usi: {required: true, description: "mzspec:<PXD>:<file>:scan:<n>:<ProForma>/<z>. Resolvable via PRIDE PROXI."}
      peptidoform: {required: true, description: "ProForma 2 string with UNIMOD accessions."}
      base_sequence: {required: true, description: "Unmodified amino-acid sequence."}
      precursor_charge: {range: integer, required: true, description: "Precursor charge state."}
      precursor_mz: {range: float, description: "Observed precursor m/z."}
      retention_time_min: {range: float, description: "Retention time of the MS2 scan in minutes."}
      score: {range: float, description: "Search-engine score."}
      delta_score: {range: float, description: "Score difference to the next-best candidate."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, required: true, description: "False discovery rate q-value (0-1), from target-decoy counting over the search score. It does not depend on PEP, which makes it the more stable column across MetaMorpheus releases (pep 002)."}
      q_value_notch: {range: float, minimum_value: 0, maximum_value: 1, description: "q-value within the match's notch (mass-offset bin). Producers that accept a match on both q-values report counts that cannot be reproduced from q_value alone."}
      notch: {description: "The producer's notch assignment, verbatim. A search that leaves it unresolved reports several candidates separated by '|', and that text is the evidence for notch_ambiguous."}
      notch_ambiguous: {range: boolean, description: "The notch never resolved to one value. Producers exclude these from their headline identification count even though both q-values pass, so a count taken without this column cannot be reproduced (aging DEF-PSM-1PCT v1)."}
      pep: {range: float, minimum_value: 0, maximum_value: 1, description: "The producer's posterior error probability (0-1). RUN-RELATIVE: MetaMorpheus trains its PEP model afresh on every search, from that search's own targets and decoys, so values from two datasets come from two models even on one release. Rank or threshold within a dataset; never compare values across datasets or releases (pep 002, definition pep:DEF-PEP)."}
      pep_q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "q-value from ordering the PSMs by `pep`, so it moves whenever `pep` does. A count at a threshold compares across datasets within one MetaMorpheus release; across releases use `q_value`, which does not depend on PEP (pep 002)."}
      mass_error_ppm: {range: float, description: "Precursor mass error in ppm."}
      target_decoy: {range: TargetDecoy, required: true, description: "Target, decoy or contaminant."}
      protein_accessions: {range: Protein, multivalued: true, description: "All protein accessions the peptide maps to."}
      ambiguity_level: {description: "Producer's ambiguity level (e.g. MetaMorpheus 1-5), including I/L."}
      localization_score: {range: float, description: "Producer's modification-localization score."}
      search: {description: "Which search produced it (standard, gptmd, glyco_*)."}
      missed_cleavages: {range: integer, description: "Number of missed protease cleavages."}
      nonspecific_termini: {range: integer, minimum_value: 0, maximum_value: 2, description: "Termini not matching the protease (L3 truncation)."}
      start_residue: {range: integer, description: "First residue of the peptide in the protein (1-based)."}
      end_residue: {range: integer, description: "Last residue of the peptide in the protein (1-based)."}
      matched_ion_series: {description: "Producer's annotated fragment list, verbatim (F7; full evidence is R14)."}
      matched_ion_count: {range: integer, description: "Number of matched fragment ions."}

  Peptidoform:
    description: One peptidoform in one dataset (best evidence across runs).
    annotations: {qpx_view: feature}
    attributes:
      peptidoform_id: {identifier: true, description: "<dataset_id>:<ProForma>"}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      peptidoform: {required: true, description: "ProForma 2 string with UNIMOD accessions."}
      base_sequence: {required: true, description: "Unmodified amino-acid sequence."}
      best_q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Lowest q-value among the supporting PSMs."}
      best_q_value_notch: {range: float, minimum_value: 0, maximum_value: 1, description: "Lowest notch q-value among the supporting PSMs."}
      best_pep: {range: float, minimum_value: 0, maximum_value: 1, description: "Lowest `pep` among the supporting PSMs. RUN-RELATIVE, like `Psm.pep`: rank or threshold within the dataset, never compare values across datasets or releases (definition pep:DEF-PEP)."}
      target_decoy: {range: TargetDecoy, required: true, description: "Target, decoy or contaminant. Decoy peptidoforms are kept so a caller can recompute FDR."}
      n_psms: {range: integer, description: "Number of PSMs supporting this row."}
      protein_group_id: {range: ProteinGroup, description: "Protein group the peptidoform was assigned to."}
      protein_accessions: {range: Protein, multivalued: true, description: "All protein accessions the peptide maps to."}
      is_unique: {range: boolean, description: "Maps to exactly one protein (R11, mzLib REQ-MZLIB-1)."}
      is_isoform_specific: {range: boolean, description: "Distinguishes one isoform (O-section questions)."}
      engine_full_sequences: {multivalued: true, description: "The producer's own notation for this peptidoform, VERBATIM (MetaMorpheus `Full Sequence`, engine modification names such as `[Common Biological:Phosphorylation on T]`). A set, not a pick: when two engine names resolve to one UNIMOD accession, one `peptidoform` comes from two producer strings, and both are listed. `peptidoform` is the UNIMOD-resolved ProForma key; this is the engine-name form, and it is the only place a modification with no UNIMOD accession keeps its name rather than a mass tag (ptmQtl 002, DATAREPO-P3). Not ProForma: engine names are not a ProForma controlled vocabulary."}

  ProteinGroup:
    description: One protein group in one dataset.
    annotations: {qpx_view: pg}
    attributes:
      protein_group_id: {identifier: true, description: "<dataset_id>:<sorted accessions joined by ;>"}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      protein_accessions: {range: Protein, multivalued: true, required: true, description: "All protein accessions the peptide maps to."}
      genes: {multivalued: true, description: "Gene names of the member proteins."}
      target_decoy: {range: TargetDecoy, description: "Target, decoy or contaminant, as the producer classified the group."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Protein-group q-value."}
      sequence_coverage: {range: float, minimum_value: 0, maximum_value: 1, description: "Fraction of the sequence covered (0-1)."}
      unique_peptides: {range: integer, description: "Number of peptides unique to this group."}
      shared_peptides: {range: integer, description: "Number of peptides shared with other groups."}

  Protein:
    description: One UniProt entry (isoforms are separate rows).
    attributes:
      protein_accession: {identifier: true, description: "UniProt accession (isoform suffix kept) or custom-database ID."}
      canonical_accession: {range: Protein, description: "Self for canonical entries."}
      gene: {description: "Primary gene name."}
      organism: {range: uriorcurie, description: "NCBITaxon term of the database this entry came FROM -- the searched proteome's organism. NULL for a contaminant-database entry and for a decoy, because neither is evidence of the sample's organism: a contaminant panel is bovine, porcine, equine and bacterial by design, and a reversed decoy sequence is no organism's protein at all. It was `required: true` until schema 0.0.7, and that is exactly what made it wrong -- a required column with no true value gets a false one, so all 339 contaminant entries in aging's catalog read NCBITaxon:9606 including porcine trypsin, bovine albumin and E. coli lacZ, and `is albumin detected?` returned bovine P02769 as human ALB. Where the producer names a species, `organism_name` carries it verbatim; mapping that name to a taxon is nobody's job here yet (G36)."}
      organism_name: {description: "The producing search engine's own species name for this entry, verbatim: `Bos taurus`, `Sus scrofa`, `Equus caballus`, `Escherichia coli (strain K12)`. MetaMorpheus supplies it per accession and it is the only species evidence there is for a contaminant-panel entry. Stored as the producer wrote it and never parsed into a taxon here, because a name-to-NCBITaxon map is a reference resource this project does not own (D1); a caller that needs the CURIE joins one in."}
      length: {range: integer, description: "Sequence length in residues."}
      source_db: {required: true, description: "uniprot, or the custom database that supplied it (e.g. progerin, D8)."}
      uniprot_release: {description: "UniProt release the entry was taken from."}
      is_contaminant: {range: boolean, description: "True if the entry comes from the contaminant database."}

  # ---- PTMs, glyco, proteoforms -------------------------------------------------------------
  PtmSite:
    description: One modified residue on one protein in one dataset, from PSM evidence.
    attributes:
      ptm_site_id: {identifier: true, description: "<dataset_id>:<accession>:<residue><position>:<modification_name>, with '@<site_type>' appended ONLY when site_type is not 'residue' -- so no id written before schema 0.0.5 moves (aging 024 section 4). A terminal site is keyed on the position of the residue it sits on, never on a sentinel position: a protein N-terminal acetylation and an N6-acetyllysine on residue 1 are different chemistries at the same coordinate, and a key that cannot separate them will eventually merge them.  The last component is the SEARCH ENGINE'S OWN NAME for the modification (MetaMorpheus's IdWithMotif, e.g. 'Carbamidomethyl on C'), never the UNIMOD accession. Keying on UNIMOD cost sites: a modification with no UNIMOD cross-reference cannot form such a key at all, so its sites were not written as nulls -- they were not written, and a query for them returned an empty answer indistinguishable from 'never identified' (aging 019 section 3; Hydroxybutyrylation on K, 43 PSMs and 10 peptidoforms in PXD027318, 0 sites). It is not a rare shape: mzLib 1.0.591 carries a Unimod cross-reference on 86.8% of Mods.txt and 33.6% of ptmlist.txt, so a GPTMD run over UniProt annotations meets unmapped names routinely. The name is always present, which is the whole argument, and QuantProject has ruled that the native identity of a site is (database version, accession, position, IdWithMotif) with Unimod a DERIVED VIEW over it -- a derived view cannot be the key, because it cannot represent everything the engine finds. The id is also then invariant under a mapping improvement: when mzLib later gives Hydroxybutyrylation an accession, `modification` fills in and no id moves. Nothing is lost cross-dataset, because dataset_id is the first component and so this key never joins across datasets anyway: that is what the `modification` and `modification_name` COLUMNS are for. The residue is load-bearing and must not be dropped to 'simplify' the key: one UNIMOD accession covers several chemistries on different residues (UNIMOD:7 is deamidation on N and on Q and citrullination on R; UNIMOD:35 is hydroxylation on K/N/P and oxidation on M), so a key without it merges them."}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      protein_accession: {range: Protein, required: true, description: "UniProt (or custom-database) accession, isoform suffix kept."}
      position: {range: integer, required: true, description: "Residue position in the protein (1-based)."}
      residue: {description: "Modified amino acid (one-letter code) -- for a terminal site, the residue the modification actually sits ON, not the string 'N-term'. A terminus is a position, and the thing modified there is still a residue; `site_type` carries the fact that it is terminal. Nullable because a producer can place a modification at a terminus without naming the residue, and a null is then honest where a guess would not be."}
      site_type: {range: SiteType, required: true, description: "Where on the molecule the modification sits. Defaults to `residue`, which is what almost every row is; the terminal values exist because the ingester skipped every modification at a peptide terminus before schema 0.0.5, so `ptm_sites` held 0 rows for placements `peptidoforms` held in full. Measured on the corpus after the fix (aging 028): **2,091 terminal sites at q<=0.01** -- 1,220 `protein_n_term` and 871 `peptide_n_term`, 20,789 PSMs, `ptm_sites` 35,615 -> 38,045 with every other table identical row-for-row. (aging's pre-fix estimate of 1,367 was RETRACTED in their 029: it counted peptidoforms whose ProForma begins with a modification, which conflates the two site types and misses every first-residue placement not written as a prefix.) N-terminal acetylation is co-translational, among the most abundant marks in any proteome, and governs the N-degron pathway and so protein turnover: it is not a tail chemistry in an aging repository. A reader querying `ptm_sites` for acetylation before this got a lysine-only answer with nothing saying so."}
      modification: {range: uriorcurie, description: "UNIMOD accession, ABSENT when the search engine's modification has no UNIMOD cross-reference. A null here means 'this chemistry has no Unimod term in the registry that searched it', never 'unmodified' and never 'unknown chemistry': `modification_name` always says what it is. A caller aggregating by UNIMOD must decide what to do with these rows rather than have them silently dropped, which is what keying on UNIMOD used to do for them."}
      modification_name: {required: true, description: "The search engine's own name for the modification, verbatim (MetaMorpheus's IdWithMotif, e.g. 'Hydroxybutyrylation on K'). Always present, and the component of ptm_site_id that makes the key always formable. It is engine-specific by construction, which is safe here because a dataset is searched by one engine and dataset_id is part of the key; cross-dataset work goes through `modification`, or through this column when both datasets share an engine."}
      target_decoy: {range: TargetDecoy, description: "Target or contaminant, from the supporting PSMs. Contaminant sites are kept because they are real measurements of real molecules and are used as a process control, but they are not the sample, so a caller filters on this rather than having the decision made for them."}
      best_ambiguity_level: {description: "Lowest producer ambiguity level among the PSMs that placed this site (1 < 2A < 2B < 2C < 2D < 3 < 4 < 5). Sites are emitted at any level, because the producer's occupancy population applies no level filter. `best_ambiguity_level = '1' AND target_decoy = 'target'` selects exactly the site set a level-1, target-only derivation produces -- but n_psms and best_q_value on those rows count all the evidence, so they are not the same numbers that derivation would report."}
      localization_score: {range: float, description: "Producer's modification-localization score. Null for an ordinary GPTMD hit, which MetaMorpheus does not localize -- absence here means the producer computed none, not that the site is unlocalized, and a caller asking whether a site is confidently localized should be refused rather than given an empty cell."}
      n_psms: {range: integer, description: "Accepted PSMs that placed this site, at any ambiguity level and including contaminant PSMs. This is evidence depth for the site, and it is the measure the producer's occupancy denominator is built from, so it deliberately counts more broadly than a level-1 target-only view would."}
      best_q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Lowest q-value among the supporting PSMs."}

  PtmStoichiometry:
    description: >-
      PTM site occupancy -- the modified fraction of one site -- in one run or sample group, as
      MetaMorpheus computes and writes it (the `CountOccupancy_<label>` and `IntensityOccupancy_<label>`
      cells of the protein-group table, read with pyMzLib `read_occupancy`). Never computed here (D29):
      the ingester stores both bases MetaMorpheus writes, with everything behind each fraction, because
      this is one of the repository's central measurements. Definitions are QuantProject's
      (`DEF-OCC-*`, register v3-v3.5). One row per (site, run) where a MODIFIED form was seen; a site
      seen only unmodified has no row, and absence is NA, never 0 (DEF-OCC-ABSENT). The two bases are
      authoritative in OPPOSITE halves of the cell: for counts the integers are exact and the written
      fraction is rounded to 2 decimals; for intensity the written fraction (4 decimals) is exact and
      the pair is rounded to 4 significant figures (DEF-OCC-CELL v3.2). Occupancy is MS/MS-only (MBR
      transfers do not enter, DEF-OCC-INT) and excludes `Common Variable` and `Common Fixed` modification
      types, so a default search reports no oxidation or carbamidomethyl occupancy (DEF-OCC-PSMS). No
      minimum evidence is applied; QuantProject recommends reading only `n_covering_psms >= 5`
      (DEF-OCC-MINIMUM). Which group member a site belongs to is resolved against the searched sequence,
      never by the `|` segment's position (DEF-OCC-ACCESSION). Not stored for TMT or SILAC datasets.
    attributes:
      ptm_site_id: {range: PtmSite, required: true, description: "The site, keyed as `ptm_sites` keys it (the engine's own modification name). MetaMorpheus's position is converted to ours: equal for a residue, 0 -> 1 with `@protein_n_term`, Length + 1 -> Length with `@protein_c_term` (DEF-OCC-KEY)."}
      assay_id: {range: Assay, required: true, description: "The run's (or sample group's) assay. With `denominator_grouping = run` it is that raw file's label-free assay."}
      denominator_grouping: {range: OccupancyGrouping, required: true, description: "Whether the denominators on this row cover one run or a pooled sample group (DEF-OCC-GROUPING). Never compare the two."}
      sample_label: {required: true, description: "MetaMorpheus's own `<label>` from the column name, verbatim (e.g. `..._01-calib`), so a row round-trips to the file."}
      protein_group_id: {range: ProteinGroup, required: true, description: "The protein group whose cell the entry was written in."}
      mm_position: {range: integer, required: true, minimum_value: 0, description: "The position as MetaMorpheus wrote it (`pos{p}`): 1-based in the accession's sequence, 0 for the protein N-terminus, Length + 1 for the C-terminus."}
      mm_modification: {required: true, description: "The modification exactly as the cell names it (`IdWithMotif`)."}
      occupancy_state: {range: OccupancyState, required: true, description: "quantified, floor, count_only or intensity_unassigned (DEF-OCC-COUNTONLY). Read it before any intensity column."}
      modified_fraction_count: {range: float, minimum_value: 0, maximum_value: 1, description: "Count-based occupancy AS WRITTEN (2 decimals, rounded; DEF-OCC-COUNT). For the exact value use `n_modified_psms / n_covering_psms`, which are authoritative for this basis. Kept in its own column, never merged with the intensity estimate: the two disagree threefold overall."}
      n_modified_psms: {range: integer, minimum_value: 0, description: "PSMs whose resolved form carries the modification here: the count numerator, EXACT (DEF-OCC-COUNT). Spectra, not peptides."}
      n_covering_psms: {range: integer, minimum_value: 1, description: "PSMs covering the position, modified or not: the count denominator, EXACT. An ambiguous PSM counts here for every position its base sequence covers (DEF-OCC-PSMS). This is the evidence depth; QuantProject recommends >= 5 (DEF-OCC-MINIMUM)."}
      count_is_ceiling: {range: boolean, description: "True when every covering PSM carried the modification (`n_modified_psms = n_covering_psms`): an occupancy of 1 means no unmodified PSM was seen, which on a shallow site is weak evidence of full occupancy. NULL with no count entry."}
      modified_fraction_intensity: {range: float, minimum_value: 0, maximum_value: 1, description: "Intensity-based occupancy AS WRITTEN (4 decimals), and for this basis the written fraction IS authoritative (DEF-OCC-INT, DEF-OCC-CELL v3.2). NULL when count_only."}
      intensity_modified: {range: float, minimum_value: 0, description: "The intensity numerator: summed apex intensity share of the modified forms (DEF-OCC-INT), ROUNDED to 4 significant figures by the writer. NULL when count_only."}
      intensity_total: {range: float, minimum_value: 0, description: "The intensity denominator: summed intensity share of every covering form, rounded to 4 significant figures. Use it to weight or pool runs: sum numerators over summed denominators, never average fractions (DEF-OCC-SYNONYM's rule). NULL when count_only."}
      intensity_is_floor: {range: boolean, description: "True for `occupancy_state = floor`: a fraction of 0 whose numerator is a literal 0, meaning the modified form was identified but never quantified. CENSORED, not a measured zero (DEF-OCC-INT-ZERO). NULL when count_only."}
      intensity_is_ceiling: {range: boolean, description: "True when the intensity fraction is 1: no unmodified covering form was quantified, the mirror of the floor. NULL when count_only."}
      definition_id: {range: Definition, required: true, description: "`QuantProject:DEF-OCC-CELL`, the definition of both cells and of the states; the count and intensity columns cite DEF-OCC-COUNT and DEF-OCC-INT, which it carries."}

  Glycopeptide:
    description: >-
      One glycopeptide identification (R16). Glycans are stored as COMPOSITIONS, never structures
      (trap J9). Quant goes in QuantValue with feature_type glycopeptide.
    attributes:
      glycopeptide_id: {identifier: true, description: "Stable ID: dataset, peptidoform and composition."}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      peptidoform: {required: true, description: "ProForma 2 string with UNIMOD accessions."}
      protein_accession: {range: Protein, required: true, description: "UniProt (or custom-database) accession, isoform suffix kept."}
      glycosite_positions: {range: integer, multivalued: true, description: "Glycosylated residue positions in the protein (1-based)."}
      glycan_type: {range: GlycanType, required: true, description: "N-linked, O-linked or both on one peptide."}
      glycan_composition: {required: true, description: "e.g. HexNAc(4)Hex(5)NeuAc(2)."}
      localization_level: {range: GlycoLocalizationLevel, description: "How confidently the glycan is placed on its residue."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "False discovery rate q-value (0-1)."}
      n_psms: {range: integer, description: "Number of PSMs supporting this row."}

  ProteoformInference:
    description: >-
      A proteoform INFERRED from bottom-up evidence (R7b; no top-down data). Sites on different
      peptides are not evidence of one molecule (trap J16): `sites_on_one_peptide` says whether any
      single peptide carries them all.
    attributes:
      proteoform_id: {identifier: true, description: "Stable ID of the inferred proteoform."}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      protein_accession: {range: Protein, required: true, description: "UniProt (or custom-database) accession, isoform suffix kept."}
      proforma: {required: true, description: "Full-protein ProForma of the inferred form."}
      supporting_peptidoforms: {range: Peptidoform, multivalued: true, required: true, description: "Peptidoforms the inference rests on."}
      sites_on_one_peptide: {range: boolean, required: true, description: "True only if a single peptidoform carries every site (trap J16)."}
      inference_confidence: {range: float, minimum_value: 0, maximum_value: 1, required: true, description: "Producer's confidence in the inference (0-1)."}
      definition_id: {range: Definition, required: true, description: "Owner's definition ID giving this number its meaning."}

  # ---- quantities ---------------------------------------------------------------------------
  QuantValue:
    description: >-
      One quantity of one feature in one assay. Long format (D5). Missing = no row or NA, never 0.
      A stored 0 is a MEASURED zero, and occurs only where the value's definition says 0 is a
      measurement: a spectral count (QuantProject:DEF-PROT-SPC, no qualifying PSM). An intensity of
      0 means not measured and is never stored. So count detections with `value > 0`, never by
      counting rows (0.18.0).
    annotations: {qpx_view: feature}
    attributes:
      assay_id: {range: Assay, required: true, description: "Assay (run x channel) this value was measured in."}
      feature_type: {range: FeatureType, required: true, description: "Which table feature_id points into."}
      feature_id: {required: true, description: "ID in the table named by feature_type."}
      value: {range: float, description: "The quantity, IN THE UNITS OF ITS `definition_id` AND IN NO OTHER. This column holds several incommensurable quantities at once -- on aging's catalog, FlashLFQ intensities (median 1.2e6) and spectral counts (median 3) sit in the same column, separable only by `definition_id`. Always group or filter by `definition_id`; a median, sum or ratio taken across the bare column mixes units and is meaningless. An agent that did exactly that reported a spurious million-fold protein difference between two of aging's datasets, which is the grain rule (U8) broken inside a single column rather than between tables. Absent row or NA when not measured, never 0. A stored 0 is a measured zero and appears only for a definition that says so -- a spectral count (QuantProject:DEF-PROT-SPC); an intensity is never stored as 0. Count detections with `value > 0`, not by counting rows."}
      detection_type: {range: DetectionType, description: "How the value was obtained: MS/MS or match-between-runs."}
      pip_q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "FlashLFQ MBR peak q (PIP Q-Value)."}
      mbr_kept: {range: boolean, description: "Passes the producer's MBR filter (QuantProject DEF-MBR-KEPT)."}
      definition_id: {range: Definition, required: true, description: "e.g. apex intensity (aging D13)."}

  # ---- annotations & reference sets (stored, owned elsewhere) -------------------------------
  AnnotationSource:
    description: A versioned annotation set from its owner (go's organelle map, UniProt, half-lives…).
    attributes:
      source_id: {identifier: true, description: "Stable ID of the annotation set, e.g. go-organelle-map-v3."}
      owner_project: {required: true, description: "Project that owns and maintains the content."}
      version: {required: true, description: "Owner's version string."}
      doi: {range: uriorcurie, description: "DOI, if one has been minted."}

  ProteinLocalization:
    description: >-
      Protein -> GO-CC term, as supplied by `go`. Never computed here. One row per (accession, term)
      for the accessions that carry the term themselves -- go expands its (group, term) row over
      `accession_used`, never over every group member (go D22) -- so a member that does not carry a
      term gets no row. The organelle CATEGORY is not on this row: it is a property of the term, not
      the protein, and lives once in `organelle_term_categories`, joined on (compartment,
      go_release) (go 004, DATAREPO-29/30). The row carries NO category map: under go D28 an
      annotation is map-independent and one annotation file serves every consumer map, so the join
      yields one category row per map and a query names the map it means (schema 0.0.9, go 009
      section 4: `organelle_map_version` was `required` here with no true value). There is no leading-protein
      column and never will be: MetaMorpheus computes none, and member order is alphabetical
      (go D25). Contract: go's own rulings (D1-D26), not the superseded REQ-GO-2..10.
    attributes:
      protein_accession: {range: Protein, required: true, description: "UniProt (or custom-database) accession, isoform suffix kept."}
      compartment: {range: uriorcurie, required: true, description: "GO-CC term the protein's own entry carries, directly or by propagation (go's `go_id`). Named `compartment` as in `organelle_age_summaries`, and because published queries join on it."}
      go_release: {required: true, description: "GO ontology release, from the file header (go D9). With `compartment`, the key into organelle_term_categories: an ancestor edge moving between releases moves a term's category with the map unchanged (go 004 section 3)."}
      evidence: {description: "Evidence code or note from the source."}
      source_id: {range: AnnotationSource, required: true, description: "Annotation source (owner + version) this row comes from."}
      protein_group: {description: "go's `protein_group`: the MetaMorpheus group this accession was annotated in, its accessions `|`-joined in the producer's (alphabetical, not ranked) order. An accession sits in one group or the file is refused. Filled by go's released output (schema 0.0.10)."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "The GROUP's protein q-value, as go copies it from the search (go D29). The same on every row of one group. Every non-decoy group is written, so filter on it: go's header counters count at `q_value <= counter_q_value_max`."}
      n_members: {range: integer, minimum_value: 1, description: "Accessions in the group (go D22)."}
      n_with: {range: integer, minimum_value: 1, description: "Group accessions whose own entry carries this term (go D22). `n_with < n_members` means the term is not true of the whole group."}
      inherited: {range: boolean, description: "go's `inherited`: the term reached this accession from another entry rather than its own (go D22). Read it before treating the row as the entry's own annotation."}
      propagated: {range: boolean, description: "go's `propagated`: the term was reached by ancestor propagation over is_a and part_of, not annotated directly."}

  OrganelleTermCategory:
    description: >-
      Which organelle category a GO-CC term falls in, under one category map (name and version) and
      one ontology release. One row per (term, category, subcategory): a term in two categories is
      two rows, and nothing is ever a list paired by position. Stored once per term instead of
      repeated on every protein row, so two rows cannot disagree (DATAREPO-29). go writes one
      category file per consumer map beside each annotation file (go D28). Coverage check, refused
      on failure: every `compartment` here appears in the paired annotation file with the same
      `go_release`, since a mismatched pair stored is a join that silently drops categories (go 009
      section 4; replaces the per-row cross-check, which lapsed with D28). The map's CONTENT is the
      consumer's (aging's `aging-organelle-map`, charter S17); go owns only the format. Producer: go.
    attributes:
      compartment: {range: uriorcurie, required: true, description: "GO-CC term (go's `go_id`)."}
      category_map_name: {required: true, description: "The category map's name, from the category file header (`#!category_map <name> <version> <sha256>`), e.g. `aging-organelle-map`. With the version, it names one consumer's map: two consumers' maps can share a version number and mean different things."}
      organelle_map_version: {required: true, description: "The category map's version, from the same header line (go's `category_map_version`)."}
      go_release: {required: true, description: "GO ontology release. The category is a function of the PAIR (go 004, DATAREPO-30)."}
      organelle_category: {required: true, description: "go's organelle category for this term, e.g. `mitochondrion`."}
      organelle_subcategory: {description: "Qualified subcategory with its prefix kept, e.g. `mitochondrion:inner_membrane`. NULL when the category has none."}
      source_id: {range: AnnotationSource, required: true, description: "Annotation source (owner + version) this row comes from."}

  ProteinAnnotation:
    description: >-
      Any other per-protein fact from an owner (R6: half-life with tissue/organism, ELLP,
      genome of origin, complex membership; R5 orthologs). Key/value so new facts need no schema change.
    attributes:
      protein_accession: {range: Protein, required: true, description: "UniProt (or custom-database) accession, isoform suffix kept."}
      key: {required: true, description: "Fact name, e.g. half_life_days, ellp, genome_of_origin, complex, ortholog."}
      value: {required: true, description: "Fact value, as the owner gives it."}
      position: {range: integer, description: "Set for residue-level facts, e.g. predicted deamidation rate (L2)."}
      qualifier: {description: "e.g. tissue or organism a half-life was measured in."}
      source_id: {range: AnnotationSource, required: true, description: "Annotation source (owner + version) this row comes from."}

  GeneResolution:
    description: >-
      Protein -> stable Ensembl gene, as logs' resolver (mzLib `EnsemblGeneResolver`, pyMzLib
      `proteins.resolve_genes`) writes it for one searched database against one pinned gene set.
      Never computed here: the instance operator runs the released engine through `datarepo run
      logs.resolve_genes`, which stores its rows unchanged as an engine artefact beside the bundles
      (D28), never inside one. One row per (protein, gene), or one outcome row for a protein with no
      gene on the assembly; never a pick among several genes and never a `|`-joined cell. Columns
      after `definition_id` are mzLib's `GeneResolutionTsv` names. Join to `proteins` on
      `accession` (entry level, LOGS-D2) AND on `search_database_sha256` being a database the
      dataset searched: the same accession resolved from a different database or gene set is a
      different row. The contaminant database is not resolved, so a contaminant protein has no
      row, and never falls back to a target's (logs 002 section 0). A gene only Ensembl's xref links
      adds a row with `source = ensembl_xref` and never changes `outcome`. Producer: logs (the
      method, `logs:DEF-GENE-RESOLUTION v1`); the rows' inputs are the operator's.
    attributes:
      definition_id: {range: Definition, required: true, description: "`logs:DEF-GENE-RESOLUTION v1`. A run without Ensembl's xref is not v1 and is refused by the runner (logs 017 section 3)."}
      accession: {required: true, description: "As the search database has it, variant suffix and all."}
      entry_accession: {description: "The UniProt entry or unversioned RefSeq accession; verbatim otherwise."}
      isoform: {range: integer, description: "UniProt isoform number. NULL: the accession has no `-N` suffix."}
      namespace: {required: true, description: "`uniprot`, `refseq` or `unrecognized`."}
      outcome: {range: GeneResolutionOutcome, required: true, description: "What the resolver found for this protein. The same on every row of one protein."}
      n_genes: {range: integer, required: true, minimum_value: 0, description: "Genes on the gene set's assembly linked to this protein. 0 is a count, not a missing value."}
      gene_id: {description: "Stable Ensembl gene id (`ENSG...`). NULL: no gene on the assembly (the outcome says why)."}
      versioned_gene_id: {description: "The gene id as the database wrote it. NULL: no gene."}
      gene_symbol: {description: "The gene set release's symbol, for display only. NULL: no gene, or the release names none."}
      gene_biotype: {description: "The gene set release's biotype. NULL: no gene."}
      off_primary_genes: {range: integer, required: true, minimum_value: 0, description: "Linked genes OUTSIDE the gene set (ALT haplotypes, patches), not counted in `n_genes`. 0 is a count."}
      uniprot_gene_name: {description: "The database entry's own primary gene name, a label. NULL: the entry gives none."}
      source: {required: true, description: "`search_database_dbreference`, or `ensembl_xref` for a gene only Ensembl links."}
      search_database_sha256: {required: true, description: "sha256 of the decompressed searched database. Equal to the sha256 a bundle's `bundle.json` records for that database."}
      gene_set_release: {description: "Ensembl release of the gene set, e.g. `116`. NULL: the GTF's name carried none."}
      gene_set_sha256: {required: true, description: "sha256 of the Ensembl GTF the gene set was made from. The runner checks it against logs' manifest."}
      ensembl_xref_agrees: {range: boolean, description: "Whether Ensembl's UniProt xref links this pair. NULL: the row has no gene (unknown, not false)."}
      ensembl_xref_info_type: {description: "Ensembl's evidence for the link (`DIRECT`, `SEQUENCE_MATCH`, `INFERRED_PAIR`). NULL: no xref link."}
      ensembl_xref_sha256: {required: true, description: "sha256 of Ensembl's UniProt xref file. Always present: v1 requires the xref."}

  FeatureSet:
    description: A curated, versioned list of proteins or features (R8 reference panels).
    attributes:
      feature_set_id: {identifier: true, description: "Stable ID of the set, e.g. protage-204-v1."}
      name: {required: true, description: "Human-readable name."}
      version: {required: true, description: "Owner's version string."}
      owner_project: {required: true, description: "Project that owns and maintains the content."}
      doi: {range: uriorcurie, description: "DOI, if one has been minted."}
      description: {description: "What the set is and where it comes from."}

  FeatureSetMember:
    description: "One member of a FeatureSet."
    attributes:
      feature_set_id: {range: FeatureSet, required: true, description: "Set this member belongs to."}
      feature_type: {range: FeatureType, required: true, description: "Which table feature_id points into."}
      feature_id: {required: true, description: "Identifier of the feature in the table named by feature_type."}
      role: {description: "e.g. weight or direction, as the owner defines it."}

  # ---- trust --------------------------------------------------------------------------------
  Metric:
    description: >-
      One producer-defined number about a dataset or run (PSM count at 1% FDR, ID rate, contaminant
      share…). Long, so two producers' versions of one number sit side by side with their
      definitions (S21) and new QC metrics need no schema change.
    attributes:
      scope: {range: MetricScope, required: true, description: "Whether the metric is about a dataset or a run."}
      scope_id: {required: true, description: "dataset_id or run_id."}
      name: {required: true, description: "Metric name, e.g. psms_1pct, id_rate, contaminant_share."}
      value: {range: float, description: "Metric value; NA if not computed."}
      definition_id: {range: Definition, required: true, description: "Owner's definition ID giving this number its meaning."}
      source: {required: true, description: "File the number came from, e.g. provenance.json id_rate, results.txt."}

  SearchModification:
    description: >-
      One modification the search task DECLARED -- what the engine was configured to look for, not
      what it could have found and not what it placed (G28). The distinction is not pedantic: all
      three ingested datasets declare 33 UNIMOD accessions while their peptidoforms carry 16, 46 and
      57, and `UNIMOD:45` and `UNIMOD:422` are PLACED in all three while appearing in no
      declaration at all -- found twice, independently, from the GPTMD-over-UniProt direction
      (dataRepo 021 section 6) and from the terminal-motif direction (aging 024 section 4).

      The table is honestly "what the search task declared", which is a useful thing to hold,
      PROVIDED nothing believes it is "what the search could have found". Both halves are named
      explicitly so the difference survives the naming (aging 024 section 6): this is the
      `_declared` table, and `search_modifications_placed` is the derived counterpart. A J8-style
      mass-silent check reads the PLACED one.
    attributes:
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      modification: {range: uriorcurie, description: "UNIMOD accession, absent for a modification that has none (metal adducts, engine-specific entries). `name` always identifies it."}
      name: {required: true, description: "Modification name as the search engine lists it."}
      residues: {required: true, description: "Residues or termini it was allowed on."}
      usage: {range: ModUsage, required: true, description: "Fixed, variable, GPTMD candidate or glycan."}

  Definition:
    description: A metric definition, copied from its owning register (QuantProject DEF-*, etc.).
    attributes:
      definition_id: {identifier: true, description: "The owner's ID, e.g. DEF-QC-MBR."}
      version: {required: true, description: "Owner's version string."}
      owner_project: {required: true, description: "Project that owns and maintains the content."}
      text: {required: true, description: "Full definition text, copied from the owner's register."}
      url: {range: uriorcurie, description: "Link to the definition in the owner's register."}

  ProvenanceRecord:
    description: One pipeline stage for one dataset, flattened from provenance.json (original kept).
    attributes:
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      stage: {required: true, description: "Pipeline stage name, e.g. search, fetch, qc."}
      provenance_schema: {required: true, description: "e.g. aging-provenance/2."}
      started_utc: {range: datetime, description: "Stage start time (UTC)."}
      finished_utc: {range: datetime, description: "Stage end time (UTC)."}
      pipeline_repo: {description: "Repository of the pipeline that produced it."}
      pipeline_commit: {description: "Git commit of the pipeline that produced it."}
      params_sha256: {description: "SHA-256 of the parameter file."}
      tools_json: {description: "The tools block, verbatim JSON."}
      params_json: {description: "The params block, verbatim JSON."}
      wall_seconds: {range: float, description: "Wall-clock time of the stage."}
      peak_rss_gib: {range: float, description: "Peak memory of the stage in GiB."}
      resources_json: {description: "The resources block, verbatim JSON (G9)."}
      original_path: {required: true, description: "Path of the stored provenance.json in the bundle."}
      original_sha256: {required: true, description: "SHA-256 of the stored provenance.json."}

  Finding:
    description: A flag on a dataset or run (low_id_rate, no_design_file, a SUSPICIOUS.md entry…).
    attributes:
      finding_id: {identifier: true, description: "Stable ID of the finding."}
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      run_id: {range: Run, description: "Run the finding is about, if it is run-specific."}
      code: {required: true, description: "Machine-readable flag, e.g. low_id_rate, no_design_file."}
      severity: {range: Severity, required: true, description: "How much it should change trust in the data."}
      status: {range: FindingStatus, required: true, description: "Whether it is still open."}
      message: {required: true, description: "Plain-language explanation for people and agents."}
      source: {required: true, description: "provenance flags, SUSPICIOUS.md S<n>, …"}

  # ---- relationship results (producer: ptmQtl; generic, never named after one trait) ---------
  TraitEffect:
    description: >-
      How one feature changes with one consumer-defined trait, in one scope. Generic: the trait is
      a `trait_id` the consuming project defines (for aging, `aging:DEF-AGE-EFFECT ...`), and this
      table knows nothing about any trait. Producer: ptmQtl, through mzLib (ptmQtl D1-D10). For
      v1 the model is a two-part hurdle per peptidoform, fitted over runs where its protein group
      is quantified: a detection part and an intensity part, each reported, plus a combined p.
      A part with too little support is `estimable_* = false` with NULL estimates -- the flag, not
      the NULL, is the answer, so "not estimable" never reads as "no effect". aging's
      `age_effects` is a different table from a different producer (aging's own protein-level
      fits) and is unchanged. SHAPE ONLY: nothing writes this table until the mzLib engine exists.
    attributes:
      feature_type: {range: FeatureType, required: true, description: "What the feature is: `peptidoform` in v1; `glycopeptide` and `ptm_site` (ptmQtl's occupancy_site) later."}
      feature_key: {required: true, description: "Cross-dataset feature key: the peptidoform's ProForma with the engine's modification names (ptmQtl D6). Keeps modifications with no UNIMOD accession distinct."}
      feature_key_unimod: {description: "The same feature as UNIMOD-resolved ProForma, i.e. `peptidoforms.peptidoform`, which is the join into this repository. NULL only if the producer could not resolve it."}
      protein_accessions: {range: Protein, multivalued: true, required: true, description: "EVERY accession of the feature's protein group, never the first: MetaMorpheus member order is alphabetical, not a choice (go D25)."}
      trait_id: {required: true, description: "Consumer-defined trait with version, e.g. `aging:DEF-AGE-EFFECT v1.2`."}
      response: {required: true, description: "What was regressed: `pf_beyond_protein` (peptidoform intensity with protein-group intensity as covariate), `modified_fraction`, `abundance`."}
      scope: {required: true, description: "A dataset accession for a within-dataset fit, or `meta` for the cross-dataset one."}
      beta_detect: {range: float, description: "Trait coefficient of the detection (logistic) part. NULL exactly when estimable_detect is false."}
      se_detect: {range: float, description: "Standard error of beta_detect."}
      p_detect: {range: float, minimum_value: 0, maximum_value: 1, description: "p-value of beta_detect."}
      beta_int: {range: float, description: "Trait coefficient of the intensity part, over runs where the feature was detected. NULL exactly when estimable_int is false."}
      se_int: {range: float, description: "Standard error of beta_int."}
      p_int: {range: float, minimum_value: 0, maximum_value: 1, description: "p-value of beta_int."}
      p_combined: {range: float, minimum_value: 0, maximum_value: 1, description: "Combined p over the estimable parts."}
      q: {range: float, minimum_value: 0, maximum_value: 1, description: "Multiple-testing q-value within fdr_family."}
      fdr_family: {required: true, description: "The family q was computed within, e.g. `pf_beyond_protein.biological`. Families are split by modification class so artefact sites do not spend the biological budget."}
      n_detected: {range: integer, required: true, description: "Runs where the feature was detected."}
      n_absent_protein_present: {range: integer, required: true, description: "Runs where its protein group was quantified and the feature was absent -- informative for the detection part."}
      n_protein_present: {range: integer, required: true, description: "Runs where its protein group was quantified; runs without it are dropped for this feature."}
      estimable_detect: {range: boolean, required: true, description: "Detection part had minimum support (>=3 detected, >=3 absent with protein present)."}
      estimable_int: {range: boolean, required: true, description: "Intensity part had minimum support."}
      mbr_dependent: {range: boolean, required: true, description: "The result does not survive an MS/MS-only refit."}
      mod_class: {required: true, description: "Modification class used for the FDR family: default from mzLib `ModificationType` (biological, artefact, ...), overridable per context. A column, never a filter."}
      ambiguity_level: {description: "MetaMorpheus ambiguity level of the evidence, e.g. `1`."}
      definition_id: {range: Definition, required: true, description: "Model definition, e.g. `ptmQtl:DEF-PTM-TRAIT-HURDLE v0`."}

  PtmPair:
    description: >-
      A relationship between two PTM features -- sites or peptidoforms, as `feature_type` says. Each
      side is a feature key and its protein group as real columns, never a joined string. Producer:
      ptmQtl, through mzLib. Nothing writes this table until the engine is released and the operator
      runs it (D30). Unordered: `feature_key_a < feature_key_b` by ordinal string, and `(b, a)` never
      appears (ptmQtl P6). `n` always counts RUNS; a pooled row's dataset count is `n_datasets` (D31).
    attributes:
      result_type: {range: PairResultType, required: true, description: "P, C, A or B."}
      scope: {required: true, description: "A dataset accession; `meta` (pooled across everything); or `meta:<species>`, e.g. `meta:human`, pooled within one species because a site cannot yet be matched across species (ptmQtl P10, D31)."}
      feature_type: {range: FeatureType, required: true, description: "What both sides are: `ptm_site` (keys are `ptm_site_id`s; ptmQtl's unit since their D12) or `peptidoform`. A pooled site pair names the site the same way in every dataset it pools."}
      datasets: {multivalued: true, description: "The datasets a pooled row combined. NULL on a single-dataset row, whose scope already names it."}
      n_datasets: {range: integer, minimum_value: 1, description: "How many datasets a pooled row combined (the length of `datasets`). NULL on a single-dataset row. Kept apart from `n` so no column holds two units."}
      n_datasets_agreeing: {range: integer, minimum_value: 0, description: "Of `n_datasets`, how many point the same way as the pooled result (ptmQtl P10). NULL on a single-dataset row."}
      feature_key_a: {required: true, description: "Side A: ProForma with engine names (as TraitEffect.feature_key)."}
      protein_accessions_a: {range: Protein, multivalued: true, required: true, description: "Every accession of side A's protein group."}
      feature_key_b: {required: true, description: "Side B: ProForma with engine names."}
      protein_accessions_b: {range: Protein, multivalued: true, required: true, description: "Every accession of side B's protein group."}
      same_protein: {range: boolean, required: true, description: "The two sides share a protein group."}
      flags: {range: PairFlag, multivalued: true, description: "Structural flags. Empty means none apply."}
      class_pair: {required: true, description: "Modification classes of the two sides, e.g. `biological x biological`."}
      trait_id: {description: "Consumer-defined trait. NULL for types that do not involve one."}
      stratum: {description: "The stratum; set only for result_type B, binned by the consumer."}
      sign: {description: "`+` or `-`, where the statistic has a direction."}
      statistic: {required: true, description: "What value is, e.g. `spearman_rho`, `obs_over_expected`."}
      value: {range: float, description: "The statistic's value. NULL where the statistic has none: ptmQtl writes type-P rows whose co-occupancy is undefined (1,051 `overlapping` pairs and 14 pooled rows in their first bundle), and a required column would have forced a number that was never computed. Asked of ptmQtl to confirm (our 010)."}
      n: {range: integer, description: "RUNS behind the statistic, always: on a pooled row, the total over its datasets, or NULL if the engine does not compute it. Never a dataset count (that is `n_datasets`, D31)."}
      p: {range: float, minimum_value: 0, maximum_value: 1, description: "p-value."}
      q: {range: float, minimum_value: 0, maximum_value: 1, description: "q-value within fdr_family."}
      fdr_family: {description: "Family q was computed within, e.g. `A.inter_protein.biological x biological`."}
      definition_id: {range: Definition, required: true, description: "e.g. `ptmQtl:DEF-PTM-PAIR v0`."}

  # ---- container (validation only) ----------------------------------------------------------
  Bundle:
    tree_root: true
    description: A release bundle, for validating example data. Parquet files hold one table each.
    attributes:
      releases: {range: Release, multivalued: true, inlined_as_list: true, description: "Rows of the releases table."}
      release_changes: {range: ReleaseChange, multivalued: true, inlined_as_list: true, description: "Rows of the release_changes table."}
      dataset_candidates: {range: DatasetCandidate, multivalued: true, inlined_as_list: true, description: "Rows of the dataset_candidates table."}
      datasets: {range: Dataset, multivalued: true, inlined_as_list: true, description: "Rows of the datasets table."}
      samples: {range: Sample, multivalued: true, inlined_as_list: true, description: "Rows of the samples table."}
      sample_characteristics: {range: SampleCharacteristic, multivalued: true, inlined_as_list: true, description: "Rows of the sample_characteristics table."}
      runs: {range: Run, multivalued: true, inlined_as_list: true, description: "Rows of the runs table."}
      assays: {range: Assay, multivalued: true, inlined_as_list: true, description: "Rows of the assays table."}
      psms: {range: Psm, multivalued: true, inlined_as_list: true, description: "Rows of the psms table."}
      peptidoforms: {range: Peptidoform, multivalued: true, inlined_as_list: true, description: "Rows of the peptidoforms table."}
      protein_groups: {range: ProteinGroup, multivalued: true, inlined_as_list: true, description: "Rows of the protein_groups table."}
      proteins: {range: Protein, multivalued: true, inlined_as_list: true, description: "Rows of the proteins table."}
      ptm_sites: {range: PtmSite, multivalued: true, inlined_as_list: true, description: "Rows of the ptm_sites table."}
      ptm_stoichiometry: {range: PtmStoichiometry, multivalued: true, inlined_as_list: true, description: "Rows of the ptm_stoichiometry table."}
      glycopeptides: {range: Glycopeptide, multivalued: true, inlined_as_list: true, description: "Rows of the glycopeptides table."}
      proteoform_inferences: {range: ProteoformInference, multivalued: true, inlined_as_list: true, description: "Rows of the proteoform_inferences table."}
      quant_values: {range: QuantValue, multivalued: true, inlined_as_list: true, description: "Rows of the quant_values table."}
      annotation_sources: {range: AnnotationSource, multivalued: true, inlined_as_list: true, description: "Rows of the annotation_sources table."}
      protein_localizations: {range: ProteinLocalization, multivalued: true, inlined_as_list: true, description: "Rows of the protein_localizations table."}
      organelle_term_categories: {range: OrganelleTermCategory, multivalued: true, inlined_as_list: true, description: "Rows of the organelle_term_categories table."}
      gene_resolutions: {range: GeneResolution, multivalued: true, inlined_as_list: true, description: "Rows of the gene_resolutions table."}
      protein_annotations: {range: ProteinAnnotation, multivalued: true, inlined_as_list: true, description: "Rows of the protein_annotations table."}
      feature_sets: {range: FeatureSet, multivalued: true, inlined_as_list: true, description: "Rows of the feature_sets table."}
      feature_set_members: {range: FeatureSetMember, multivalued: true, inlined_as_list: true, description: "Rows of the feature_set_members table."}
      definitions: {range: Definition, multivalued: true, inlined_as_list: true, description: "Rows of the definitions table."}
      provenance_records: {range: ProvenanceRecord, multivalued: true, inlined_as_list: true, description: "Rows of the provenance_records table."}
      findings: {range: Finding, multivalued: true, inlined_as_list: true, description: "Rows of the findings table."}
      trait_effects: {range: TraitEffect, multivalued: true, inlined_as_list: true, description: "Rows of the trait_effects table."}
      ptm_pairs: {range: PtmPair, multivalued: true, inlined_as_list: true, description: "Rows of the ptm_pairs table."}
      metrics: {range: Metric, multivalued: true, inlined_as_list: true, description: "Rows of the metrics table."}
      search_modifications_declared: {range: SearchModification, multivalued: true, inlined_as_list: true, description: "Rows of the search_modifications_declared table."}

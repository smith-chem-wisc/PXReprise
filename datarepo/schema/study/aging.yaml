# aging study layer, v0.1.0 (2026-09-20).
#
# The rule (U5): a study layer ADDS tables keyed on core identifiers and never alters a core table.
# Everything the core stores stays usable by a non-aging consumer, and a second study layer can sit
# beside this one.
#
# WHO OWNS WHAT. aging owns the CONTENT of `age_effect`, `age_effect_meta` and `age_effect_refusals`
# -- their columns are transcribed from `aging:DEF-AGE-EFFECT v1` (aging/design/DEF_AGE_EFFECT.md,
# published 2026-09-20) and none of them is dataRepo's invention. dataRepo owns the SHAPE: which
# table a column lives in, what is nullable, and what is a key. Where the definition does not name a
# column this schema does not add one; where it names a thing this schema cannot express, the
# question is asked in `design/OPEN_QUESTIONS.md` rather than guessed (D7). Every such place is
# marked ASK below.
#
# `SampleAge`, `ClockModel`, `ClockFeature`, `AgeMapping` and `OrganelleAgeSummary` are NOT yet
# definition-backed. They are the shapes proposed in DATAREPO-5 and still carry that status.

id: https://w3id.org/datarepo/study/aging
name: datarepo_aging
title: dataRepo aging study layer
description: >-
  Tables the aging project adds on top of the generic core: normalized sample age, per-dataset age
  effects and their refusals, the cross-dataset pooled effect, organelle-level summaries, age clocks
  and cross-species age mapping. aging owns the content; every table is keyed on core identifiers and
  no core table is altered.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  datarepo: https://w3id.org/datarepo/core/
  aging: https://w3id.org/datarepo/study/aging/
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  GO: http://purl.obolibrary.org/obo/GO_

default_prefix: aging
default_range: string

imports:
  - linkml:types
  - ../datarepo

enums:

  AgeResponse:
    description: >-
      What changes with age. `aging:DEF-AGE-EFFECT v1` section 1: an age effect is always OF a named
      response, because a protein's abundance and a site's modified fraction are different age
      effects on the same molecule and the point of this repository is that they can disagree.
      Never one column.
    permissible_values:
      abundance:
        description: log2 intensity. Benchmark D1, K1.
      modified_fraction:
        description: PTM occupancy, logit-transformed. Benchmark K1, K13.
      isoform_ratio:
        description: log2 ratio between isoforms. Benchmark O4.
      glycoform_fraction:
        description: logit-transformed glycoform share. Benchmark T3.

  AgeEstimator:
    description: >-
      Which estimator produced the response, where a response has more than one. QuantProject 017:
      count-based and intensity-based stoichiometry differ about threefold and MUST NEVER be
      averaged, so they are separate rows rather than one number.
    permissible_values:
      count:
        description: QuantProject:DEF-OCC-COUNT.
      intensity:
        description: QuantProject:DEF-OCC-INT.
      n/a:
        description: The response has only one estimator, e.g. abundance.

  QuantBasis:
    description: >-
      Whether a match-between-runs transferred peak was counted as present. `DEF-Q4` asks which is
      right and the user has not ruled; the definition's answer is to compute both and store both
      rows, so the unanswered question becomes a column the repository can be queried on (H8+).
    permissible_values:
      msms_only:
        description: Only peaks with an MS2 identification in that run.
      mbr_kept:
        description: Transferred peaks counted as present.

  ModelForm:
    description: The shape fitted in age. H7+ asks whether the trend is linear or has a breakpoint.
    permissible_values:
      linear:
      spline:
      breakpoint:

  FitRefusal:
    description: >-
      Why a fit was not performed. Closed list, from `aging:DEF-AGE-EFFECT v1` section 5. When a
      minimum-evidence requirement fails, NO row is written to `age_effect` -- not a row with a null
      beta -- because an absent age effect and an age effect of zero are different facts.
    permissible_values:
      n_too_small:
        description: Fewer than 8 samples in the fit.
      age_span_too_narrow:
        description: Age span under 10 years; a per-decade coefficient from less than a decade is fiction.
      too_few_distinct_ages:
        description: Fewer than 5 distinct ages; a group comparison wearing a regression's clothes.
      too_missing:
        description: Non-missing values under 60% of samples, or under 6.
      batch_confounded:
        description: Batch is confounded with age and the dataset carries no batch term.
      no_age_metadata:
        description: The dataset carries no donor ages at all. This is the value that answers trap J6.

classes:

  SampleAge:
    description: >-
      Normalized age of one sample. NOT YET DEFINITION-BACKED (DATAREPO-5). The normalizer is
      SdrfAge (sdrf/mzLib #1326) and dataRepo only stores what it returns -- parsing an age string
      is not this repository's job (D1). Only about 160 of 1,236 curated SDRFs carry a real age
      (aging G12), so absence is common and is NA. No dataset in the instance populates this table
      today: the three ingested SDRFs carry only organism and biological replicate.
    attributes:
      sample_id: {range: Sample, required: true, description: "Sample this row describes."}
      age_raw: {required: true, description: "The SDRF value verbatim, so a normalizer change can be re-run against the source rather than against a previous normalization."}
      age_years: {range: float, description: "Normalized to years. NA when not parseable, which is not the same as no age being recorded -- `age_raw` distinguishes them."}
      age_is_lower_bound: {range: boolean, description: "True for a right-censored age such as '65+' or '>=90Y'. `aging:DEF-AGE-EFFECT v1` section 5 EXCLUDES these from a primary fit and counts them in `n_age_lower_bound`; they are never silently treated as the bound value, because the datasets most likely to carry them are the ones with the oldest donors."}
      age_is_range: {range: boolean, description: "True if the SDRF gives a range (e.g. 60-69Y)."}
      normalizer_version: {required: true, description: "Version of the age normalizer (SdrfAge) used. Two rows normalized by different versions are not comparable and this is how a caller can tell."}

  AgeEffect:
    description: >-
      The estimated change in one measured quantity, for one feature, per DECADE of donor age,
      fitted WITHIN a single dataset, with its uncertainty and the evidence behind it. Content is
      `aging:DEF-AGE-EFFECT v1`; every column below is named by that definition.
      Three rules the shape enforces. PER DECADE, not per year: the datasets span 30-70 years and a
      per-year coefficient invites multiplication by a lifetime it was never fitted over. WITHIN ONE
      DATASET: raw intensities are not comparable across datasets (trap J3), so pooling happens in
      `age_effect_meta` over effect sizes only. AND A FIT THAT FAILED WRITES NO ROW: the reason goes
      to `age_effect_refusals`, because a null beta would make "no evidence" and "no effect" look
      the same.
    attributes:
      dataset_id: {range: Dataset, required: true, description: "Dataset the fit was performed within."}
      feature_type: {range: FeatureType, required: true, description: "Which table feature_id points into. ASK: the definition's section 4 writes `glycosite`, which the core FeatureType enum does not have -- it has `glycopeptide`. Using the core enum rather than forking it, and asked as DATAREPO-20."}
      feature_id: {required: true, description: "Identifier of the feature in the table named by feature_type."}
      response: {range: AgeResponse, required: true, description: "What changes with age. Part of the key."}
      estimator: {range: AgeEstimator, required: true, description: "Which estimator produced the response. Part of the key, because count- and intensity-based occupancy must never be averaged."}
      quant_basis: {range: QuantBasis, required: true, description: "Whether MBR-transferred peaks counted as present. Part of the key: both are computed and both are stored, so DEF-Q4 being open does not block the fit."}
      model_form: {range: ModelForm, required: true, description: "Linear, spline or breakpoint. Part of the key."}
      stratum: {required: true, description: "Which samples the fit ran over: `all`, `sex=female`, `sex=male` (D13), or `incl_censored` for the sensitivity fit that includes right-censored ages at face value (definition section 5). ASK: left as a string rather than an enum because the definition's own section 5 adds a value its section 2 table does not list, so the vocabulary is demonstrably open. DATAREPO-20 asks whether to close it."}
      beta: {range: float, required: true, description: "The coefficient on `age_decades = (age_years - 50) / 10`: change PER DECADE in the units of the response's transform -- log2 fold change for abundance and isoform_ratio, logit change for the fractions. Required, because a row exists only when a fit succeeded."}
      se: {range: float, required: true, description: "Standard error of `beta`. REQUIRED: the definition's section 4 says a beta without an se is not an age effect."}
      ci_low: {range: float, description: "Lower bound of the confidence interval on `beta`."}
      ci_high: {range: float, description: "Upper bound of the confidence interval on `beta`."}
      p_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Unadjusted p-value for `beta`."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Benjamini-Hochberg q-value WITHIN (dataset_id, response, estimator, quant_basis, model_form, stratum). The family is the set of features tested together and nothing else, so a q-value here may not be compared with one from another family."}
      n_samples: {range: integer, required: true, description: "Samples that entered the fit. At least 8, or no row was written."}
      n_observed: {range: integer, description: "Samples with a non-missing value for this feature."}
      n_missing: {range: integer, description: "Samples with a missing value. Missing is NA and is OMITTED from the fit, never imputed -- imputation is a modelling choice with its own definition and it is not this one."}
      age_min: {range: float, description: "Youngest donor age in the fit, in years."}
      age_max: {range: float, description: "Oldest donor age in the fit, in years."}
      age_span_years: {range: float, required: true, description: "The span the effect was fitted over. REQUIRED, and it is the column that stops a reader treating a per-decade effect from a 12-year span as evidence about a lifetime."}
      n_age_lower_bound: {range: integer, description: "How many donor ages were right-censored. Excluded from a primary fit; see `stratum = incl_censored` for the sensitivity fit."}
      covariates: {range: string, required: true, description: "The terms ACTUALLY FITTED, semicolon-separated. REQUIRED, and read strictly: a row whose covariates do not list a term did not adjust for it, whatever the protocol said. `sex` is not optional where the dataset has two levels with at least two samples each, and a dataset with more than one condition must carry a disease/condition term or the age effect absorbs the group difference."}
      normalization: {required: true, description: "What was applied before fitting, e.g. `median_log2_per_run`. Required because `DEF-PROT-INT` is un-normalized when FlashLFQ's Normalize is off, which is what every run in the instance used, so a fit that does not say what it normalized cannot be read."}
      method: {required: true, description: "The engine that fitted the model, e.g. `msqrob2`."}
      method_version: {required: true, description: "Version of that engine. Two rows fitted by different engines are not comparable, and this is how a caller can tell."}
      n_covering_psms_median: {range: float, description: "modified_fraction rows only. Median PSM depth covering the site across samples -- QuantProject's own recommended filter, and what separates a real occupancy change from a depth artifact."}
      intensity_is_floor_frac: {range: float, minimum_value: 0, maximum_value: 1, description: "modified_fraction + estimator=intensity only. Fraction of the observations that were DEF-OCC-INT-ZERO floors rather than measured values. A row where this is high is mostly censored data."}
      mbr_kept_frac: {range: float, minimum_value: 0, maximum_value: 1, description: "Fraction of the values that came from a match-between-runs transferred peak."}
      definition_id: {range: Definition, required: true, description: "`aging:DEF-AGE-EFFECT v1`. A change to the model, the covariate rule, the transform or the section 5 thresholds is a new version, not an edit."}

  AgeEffectRefusal:
    description: >-
      One fit that was NOT performed, and why. This table is what answers trap J6: "give me the age
      effect for X in liver" is answered from here -- no liver dataset carries donor ages -- rather
      than by borrowing a number from another tissue. A refusal is a statement, not an absence, which
      is why it is a row.
      ASK: `aging:DEF-AGE-EFFECT v1` names this table and its `fit_refused` vocabulary but does not
      enumerate its columns, so the shape below is dataRepo's and is asked as DATAREPO-20. Its key
      mirrors AgeEffect's so a caller can look up the refusal for the exact fit they asked for; the
      feature columns are nullable because a `no_age_metadata` refusal is dataset-level and has no
      feature to name.
    attributes:
      dataset_id: {range: Dataset, required: true, description: "Dataset the fit would have run within."}
      feature_type: {range: FeatureType, description: "Null for a dataset-level refusal such as no_age_metadata."}
      feature_id: {description: "Null for a dataset-level refusal such as no_age_metadata."}
      response: {range: AgeResponse, required: true, description: "The response that was not fitted."}
      estimator: {range: AgeEstimator, required: true, description: "The estimator that was not used."}
      quant_basis: {range: QuantBasis, required: true, description: "The quantification basis that was not used."}
      model_form: {range: ModelForm, required: true, description: "The model form that was not fitted."}
      stratum: {required: true, description: "The stratum that was not fitted."}
      fit_refused: {range: FitRefusal, required: true, description: "Why. Closed list from the definition's section 5."}
      n_samples: {range: integer, description: "Samples available, where that is what failed."}
      n_observed: {range: integer, description: "Non-missing values available, where that is what failed."}
      n_distinct_ages: {range: integer, description: "Distinct donor ages available, where that is what failed."}
      age_span_years: {range: float, description: "Age span available, where that is what failed."}
      definition_id: {range: Definition, required: true, description: "`aging:DEF-AGE-EFFECT v1`, whose section 5 sets the thresholds this row failed."}

  AgeEffectMeta:
    description: >-
      The pooled age effect for one feature ACROSS datasets. Content is
      `aging:DEF-AGE-EFFECT-META v1`; a separate table from AgeEffect because combining datasets is a
      different operation with different failure modes.
      The pooling is RANDOM-EFFECTS (DerSimonian-Laird), not fixed: these are different cohorts,
      tissues and instruments, and a fixed-effect model would assert one true effect. The
      stratification columns are refusals in disguise -- never pool across acquisition (DDA with
      DIA), across quant_method (label-free with TMT) or across tissue, because H6, I3 and D4 ask
      whether those AGREE and a pooled estimate would destroy the question.
      `n_datasets = 1` is a legitimate row carrying a null `i_squared`. It is not a meta-analysis; it
      is an honest statement that one dataset exists, which is the state of this repository for every
      tissue it holds.
    attributes:
      feature_type: {range: FeatureType, required: true, description: "Which kind of feature this row pools. ASK (DATAREPO-20): the definition's section 6 key omits feature_type, but without it `feature_id` cannot be interpreted -- and a dataset-scoped identifier such as a protein_group_id cannot be a cross-dataset key at all, so the cross-dataset identity of a feature is itself the question."}
      feature_id: {required: true, description: "Identifier of the feature, in whatever vocabulary is cross-dataset for its type. ASK (DATAREPO-20): see feature_type."}
      response: {range: AgeResponse, required: true, description: "What changes with age. Part of the key."}
      estimator: {range: AgeEstimator, required: true, description: "Part of the key."}
      quant_basis: {range: QuantBasis, required: true, description: "Part of the key."}
      stratum: {required: true, description: "Part of the key."}
      tissue: {range: uriorcurie, required: true, description: "UBERON term. Part of the key, and a hard stratification: D4 asks whether the lysosome shows the same trend in brain as in muscle, which is two rows."}
      acquisition: {range: Acquisition, required: true, description: "Part of the key, and a hard stratification: H6 and I3 ask whether DDA and DIA agree."}
      quant_method: {range: QuantMethod, required: true, description: "Part of the key, and a hard stratification: label-free and TMT are never pooled."}
      beta_meta: {range: float, required: true, description: "Random-effects (DerSimonian-Laird) pooled effect, per decade, in the response's transform units."}
      se_meta: {range: float, required: true, description: "Standard error of the pooled effect. Required for the same reason `se` is on AgeEffect."}
      ci_low: {range: float, description: "Lower bound of the confidence interval on `beta_meta`."}
      ci_high: {range: float, description: "Upper bound of the confidence interval on `beta_meta`."}
      q_meta: {range: float, minimum_value: 0, maximum_value: 1, description: "Benjamini-Hochberg across features within the same stratum."}
      n_datasets: {range: integer, required: true, description: "How many datasets contributed."}
      dataset_ids: {range: Dataset, multivalued: true, required: true, description: "WHICH datasets contributed. C3 and D1 ask for an effect seen in at least three datasets and need the list, not the count."}
      i_squared: {range: float, minimum_value: 0, maximum_value: 1, description: "I-squared heterogeneity across datasets. Null when n_datasets = 1, which is not a defect."}
      tau2: {range: float, description: "Between-dataset variance. H1's forest plot is made of this and i_squared."}
      n_direction_agree: {range: integer, description: "Contributing datasets whose effect has the same sign as the pooled one. H6 and I3 want direction agreement rather than a pooled p-value."}
      n_direction_disagree: {range: integer, description: "Contributing datasets whose effect has the opposite sign."}
      leave_one_out_max_delta: {range: float, description: "The largest change in `beta_meta` from dropping any single dataset. C2 asks whether the age effect is driven by one dataset, and this answers it as a number rather than a judgement. Null when n_datasets = 1."}
      definition_id: {range: Definition, required: true, description: "`aging:DEF-AGE-EFFECT-META v1`."}

  OrganelleAgeSummary:
    description: >-
      Meta-analytic age effect per COMPARTMENT across datasets. NOT YET DEFINITION-BACKED
      (DATAREPO-5): `aging:DEF-AGE-EFFECT-META v1` pools per feature, and rolling features up to a
      compartment is a further operation nobody has defined -- in particular how a protein in two
      compartments is counted. The shape is kept because it is the table section D's question ("do
      organelles age at different rates") reads, and it should be confirmed or replaced before it is
      filled.
    attributes:
      compartment: {range: uriorcurie, required: true, description: "GO-CC term, from go's map. The organelle map belongs to `go` (D1)."}
      organism: {range: uriorcurie, required: true, description: "NCBITaxon term."}
      organism_part: {range: uriorcurie, description: "UBERON; NA = all tissues."}
      response: {range: AgeResponse, required: true, description: "What changes with age."}
      definition_id: {range: Definition, required: true, description: "Definition ID of the roll-up that produced the estimate. There is not one yet."}
      n_datasets: {range: integer, required: true, description: "Datasets contributing to the summary."}
      n_proteins: {range: integer, description: "Proteins contributing to the summary."}
      estimate: {range: float, description: "Effect estimate (units set by the definition)."}
      standard_error: {range: float, description: "Standard error of the estimate."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Adjusted p-value across compartments."}
      heterogeneity_i2: {range: float, minimum_value: 0, maximum_value: 1, description: "I-squared heterogeneity across datasets (0-1)."}

  ClockModel:
    description: >-
      A trained age clock (R9). NOT YET DEFINITION-BACKED (DATAREPO-5); the shape is dataRepo's and
      the definition is aging's. An age clock is NOT an age effect: an effect is per feature, a clock
      is a model over many features (benchmark N1), and the definition is explicit that they are
      different tables for that reason.
    attributes:
      clock_id: {identifier: true, description: "Stable ID of the clock."}
      definition_id: {range: Definition, required: true, description: "Owner's definition ID giving this model its meaning."}
      feature_level: {description: "protein, ptm_site, proteoform or mixed (N1)."}
      training_datasets: {range: Dataset, multivalued: true, description: "Datasets used to train the clock."}
      cv_mae_years: {range: float, description: "Cross-validated mean absolute error in years."}
      heldout_mae_years: {range: float, description: "Mean absolute error on held-out datasets, in years. A clock with no held-out error has not been validated, and the two columns are separate so that cannot be hidden."}
      heldout_datasets: {range: Dataset, multivalued: true, description: "Datasets held out for validation."}

  ClockFeature:
    description: "One feature of a ClockModel with its weight. NOT YET DEFINITION-BACKED (DATAREPO-5)."
    attributes:
      clock_id: {range: ClockModel, required: true, description: "Clock this feature belongs to."}
      feature_type: {range: FeatureType, required: true, description: "Which table feature_id points into."}
      feature_id: {required: true, description: "Identifier of the feature in the table named by feature_type."}
      weight: {range: float, required: true, description: "Model weight of the feature."}

  AgeMapping:
    description: >-
      Cross-species age to life stage (R4). NOT YET DEFINITION-BACKED and NOT STARTED: rodent is in
      scope (D5) and has no age mapping, which `aging:DEF-AGE-EFFECT v1` section 10 lists as open and
      aging's. dataRepo stores it as a versioned, definition-backed lookup and does not derive it.
    attributes:
      organism: {range: uriorcurie, required: true, description: "NCBITaxon term the mapping applies to."}
      age_from: {range: float, required: true, description: "Start of the age band (inclusive)."}
      age_to: {range: float, required: true, description: "End of the age band (exclusive)."}
      age_unit: {required: true, description: "Unit of age_from and age_to (days, weeks, months, years)."}
      life_stage: {required: true, description: "Life-stage label, e.g. young adult, middle age, old."}
      human_equivalent_years: {range: float, description: "Approximate human-equivalent age in years."}
      definition_id: {range: Definition, required: true, description: "Owner's definition ID giving this mapping its meaning."}

  StudyBundle:
    tree_root: true
    description: >-
      The study layer's tables, named the same way `Bundle` names the core's. This is what
      `tools/build_tables.py` reads to generate `STUDY_TABLES`, so the layer's Parquet columns are
      the schema's and never a second hand-written copy.
    attributes:
      sample_ages: {range: SampleAge, multivalued: true, inlined_as_list: true, description: "Rows of the sample_ages table."}
      age_effects: {range: AgeEffect, multivalued: true, inlined_as_list: true, description: "Rows of the age_effects table."}
      age_effect_refusals: {range: AgeEffectRefusal, multivalued: true, inlined_as_list: true, description: "Rows of the age_effect_refusals table."}
      age_effect_meta: {range: AgeEffectMeta, multivalued: true, inlined_as_list: true, description: "Rows of the age_effect_meta table."}
      organelle_age_summaries: {range: OrganelleAgeSummary, multivalued: true, inlined_as_list: true, description: "Rows of the organelle_age_summaries table."}
      clock_models: {range: ClockModel, multivalued: true, inlined_as_list: true, description: "Rows of the clock_models table."}
      clock_features: {range: ClockFeature, multivalued: true, inlined_as_list: true, description: "Rows of the clock_features table."}
      age_mappings: {range: AgeMapping, multivalued: true, inlined_as_list: true, description: "Rows of the age_mappings table."}

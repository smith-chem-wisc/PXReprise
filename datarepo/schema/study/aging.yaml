# aging study layer, v0 (STUB, 2026-09-19). Proposed by dataRepo to show the plug-in pattern (U5);
# aging owns the content (D6, aging D1) and should confirm or replace every column here.
#
# The rule: a study layer ADDS tables keyed on core identifiers (sample_id, dataset_id, feature_id)
# and never alters a core table. Everything the core stores stays usable by a non-aging consumer.

id: https://w3id.org/datarepo/study/aging
name: datarepo_aging
title: dataRepo aging study layer
description: >-
  Tables the aging project adds on top of the generic core: normalized sample age, per-dataset age
  effects, organelle-level summaries, age clocks and cross-species age mapping. aging owns the content;
  every table is keyed on core identifiers and no core table is altered.
version: 0.0.1
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  datarepo: https://w3id.org/datarepo/core/
  aging: https://w3id.org/datarepo/study/aging/
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  GO: http://purl.obolibrary.org/obo/GO_

default_prefix: aging
default_range: string

imports:
  - linkml:types
  - ../datarepo

classes:

  SampleAge:
    description: >-
      Normalized age of one sample. Normalizer: SdrfAge (sdrf/mzLib #1326); dataRepo only stores it.
      Only ~160 of 1,236 curated SDRFs carry a real age (aging G12), so absence is common and is NA.
    attributes:
      sample_id: {range: Sample, required: true, description: "Sample this row describes."}
      age_raw: {required: true, description: "The SDRF value verbatim."}
      age_years: {range: float, description: "Normalized to years. NA when not parseable."}
      age_is_lower_bound: {range: boolean, description: "e.g. '65+' or '>80'."}
      age_is_range: {range: boolean, description: "True if the SDRF gives a range (e.g. 60-69Y)."}
      normalizer_version: {required: true, description: "Version of the age normalizer (SdrfAge) used."}

  AgeEffect:
    description: >-
      Estimated association of one feature with age in one dataset under one model (aging stage 7,
      R/msqrob2). feature_type + feature_id point into core tables.
    attributes:
      dataset_id: {range: Dataset, required: true, description: "Dataset this row belongs to (ProteomeXchange accession)."}
      feature_type: {range: FeatureType, required: true, description: "Which table feature_id points into."}
      feature_id: {required: true, description: "Identifier of the feature in the table named by feature_type."}
      response: {required: true, description: "What changes with age: abundance, modified_fraction (K1, K13), isoform_ratio (O4), glycoform_fraction (T3)."}
      model_definition_id: {range: Definition, required: true, description: "Definition ID of the statistical model that produced the estimate."}
      estimate: {range: float, description: "Effect estimate (units set by the model definition)."}
      standard_error: {range: float, description: "Standard error of the estimate."}
      p_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Unadjusted p-value."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "False discovery rate q-value (0-1)."}
      n_samples: {range: integer, description: "Samples that entered the model."}

  OrganelleAgeSummary:
    description: Meta-analytic age effect per compartment across datasets (precomputed from AgeEffect).
    attributes:
      compartment: {range: uriorcurie, required: true, description: "GO-CC term, from go's map."}
      organism: {range: uriorcurie, required: true, description: "NCBITaxon (D14)."}
      organism_part: {range: uriorcurie, description: "UBERON; NA = all tissues."}
      response: {required: true, description: "What changes with age (same vocabulary as AgeEffect.response)."}
      model_definition_id: {range: Definition, required: true, description: "Definition ID of the statistical model that produced the estimate."}
      n_datasets: {range: integer, required: true, description: "Datasets contributing to the summary."}
      n_proteins: {range: integer, description: "Proteins contributing to the summary."}
      estimate: {range: float, description: "Effect estimate (units set by the model definition)."}
      standard_error: {range: float, description: "Standard error of the estimate."}
      q_value: {range: float, minimum_value: 0, maximum_value: 1, description: "Adjusted p-value across compartments."}
      heterogeneity_i2: {range: float, minimum_value: 0, maximum_value: 1, description: "I-squared heterogeneity across datasets (0-1)."}

  ClockModel:
    description: A trained age clock (R9, aging's stage after stage 7).
    attributes:
      clock_id: {identifier: true, description: "Stable ID of the clock."}
      definition_id: {range: Definition, required: true, description: "Owner's definition ID giving this number its meaning."}
      feature_level: {description: "protein, ptm_site, proteoform, mixed (N1)."}
      training_datasets: {range: Dataset, multivalued: true, description: "Datasets used to train the clock."}
      cv_mae_years: {range: float, description: "Cross-validated mean absolute error in years."}
      heldout_mae_years: {range: float, description: "Mean absolute error on held-out datasets, in years."}
      heldout_datasets: {range: Dataset, multivalued: true, description: "Datasets held out for validation."}

  ClockFeature:
    description: "One feature of a ClockModel with its weight."
    attributes:
      clock_id: {range: ClockModel, required: true, description: "Clock this feature belongs to."}
      feature_type: {range: FeatureType, required: true, description: "Which table feature_id points into."}
      feature_id: {required: true, description: "Identifier of the feature in the table named by feature_type."}
      weight: {range: float, required: true, description: "Model weight of the feature."}

  AgeMapping:
    description: >-
      Cross-species age to life stage (R4). aging stage 7 owns it as a versioned, definition-backed
      lookup; dataRepo stores it.
    attributes:
      organism: {range: uriorcurie, required: true, description: "NCBITaxon term the mapping applies to."}
      age_from: {range: float, required: true, description: "Start of the age band (inclusive)."}
      age_to: {range: float, required: true, description: "End of the age band (exclusive)."}
      age_unit: {required: true, description: "Unit of age_from and age_to (days, weeks, months, years)."}
      life_stage: {required: true, description: "Life-stage label, e.g. young adult, middle age, old."}
      human_equivalent_years: {range: float, description: "Approximate human-equivalent age in years."}
      definition_id: {range: Definition, required: true, description: "Owner's definition ID giving this number its meaning."}

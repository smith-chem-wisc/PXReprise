# A machine file: where things live on YOUR computer. Copy this to machines/my-machine.toml and edit the paths.
# Nothing here changes a scientific result; all of it is recorded in each run's provenance.
# Use ABSOLUTE paths. On Windows, write them with forward slashes: "D:/pxreprise".

# REQUIRED. The work area: downloaded spectra (deleted after each search), search results and caches.
# Each deposit in progress briefly needs about twice its raw size.
work_root = "D:/pxreprise"

# REQUIRED to read Thermo .raw files. Thermo's RawFileReader licence must be accepted by YOU, the operator; read it at
# https://github.com/thermofisherlsms/RawFileReader before setting this to true. Your choice is recorded in provenance.
accept_thermo_licence = false

# Stop the batch when free space on the work disk falls below this (GB). Default 250.
min_free_gb = 50

# Threads one MetaMorpheus search may use. Default: every core.
# max_threads = 16

# Where search databases live; UniProt proteomes named by a profile are downloaded here automatically, once.
# Default: <work_root>/db
# database_dir = "D:/pxreprise/db"

# Download retries per file, and files downloaded at once. Defaults 8 and 4.
# fetch_attempts = 8
# parallel_downloads = 4

# A deposit whose downloads fail on every retry (PRIDE down for hours) is tried again on a later pass, after a wait,
# up to fetch_passes passes in all; then it is settled as fetch_failed. Defaults 3 and 30.
# fetch_passes = 3
# pass_wait_minutes = 30

# A download whose file has received no data for this many minutes is abandoned and retried (0 turns this off).
# On a slow or unreliable link, parallel_downloads = 2 can be faster overall than 4. Default 5.
# fetch_stall_minutes = 5

# How long one MetaMorpheus search may run. The ceiling is generous because a busy machine makes searches slow, and slow
# is not broken. A HUNG search is caught separately: it is killed once MetaMorpheus has used no CPU for
# search_stall_minutes (0 turns that check off). Defaults 48 and 90.
# search_timeout_h = 48
# search_stall_minutes = 90

# OPTIONAL (0.4.21). How long the short probe search before the whole download may run, over the profile's own value
# (60 for label-free-dda@7). Larger files take longer.
# probe_search_minutes = 90

# OPTIONAL (0.4.21). How big a deposit this machine downloads and searches whole. Each key replaces the profile's own
# [deposit] value; a key left out keeps it, and a question's [exceptions] still wins for its deposit. A deferred deposit
# gets one more look when these change and fit what its deferral measured. They choose which deposits are searched,
# never how, so no profile changes version. A running batch reads this table and probe_search_minutes again (at most every
# 30 s), so you can raise a gate without stopping it. Put this table after every plain key, beside [metamorpheus].
# [deposit_limits]
# max_files = 120                 # more raw files than this: deferred_needs_design_selection
# max_file_mb = 5000              # any one file above this: deferred_needs_design_selection
# max_est_ms2 = 3_000_000         # estimated MS2 scans for the whole deposit (0 = no cap): deferred_search_too_large
# defer_if_median_file_mb = 2200  # median raw file above this: deferred_large_files (0 = no gate)

# OPTIONAL. A private copy of .NET for MetaMorpheus. An automatic .NET update can remove the runtime under a search that
# is running, and the search then fails hours in. A copy that no updater manages prevents that. To make one, copy from
# your .NET install: dotnet.exe, host/fxr/<version>, and shared/Microsoft.NETCore.App/<version> (about 80 MB).
# Without it, MetaMorpheus uses the machine's .NET, and a search the runtime changed under is searched again.
# dotnet_root = "D:/tools/dotnet-10.0.10"

# RECOMMENDED. dataRepo, the no-Python download (https://github.com/smith-chem-wisc/dataRepo/releases): each searched
# deposit is ingested into a repository and published as a website. Leave it out and the batch stops after the search.
# datarepo = "D:/tools/datarepo/datarepo.exe"

# OPTIONAL. A Python with qc's qctemplates, to validate and render QC reports. The pipeline runs without it.
# qc_python = "C:/path/to/python.exe"

# OPTIONAL (0.4.26). Two machines on one batch: one runs probes, the other every full search and delivery. They share
# one folder. On the machine that delivers, [workers] names it. That machine keeps its next `gap` deposits to probe for
# itself (0.4.29), and assigns the prober up to `window` of the ones after them; a deposit the prober passed goes ahead
# of its queue. It takes a deposit back when the prober's heartbeat is older than `quiet_hours`, or when one deposit has
# waited `assignment_hours` for its probe. See docs/commands.md, `worker`.
# [workers]
# share = "D:/pxreprise-share"
# window = 6
# gap = 5
# quiet_hours = 2
# assignment_hours = 24
#
# On the machine that probes, [worker] names the same folder, seen from there, and that machine's own run root and
# state directory. It runs the delivering machine's copy of the question, which that machine's batch publishes at each
# start: `pxreprise batch run <share>/control/question/question.toml --machine <this file>`. It never ingests, so leave
# out `datarepo`. Its `database_dir` holds a copy of the release's database set, which it checks before it starts.
# [worker]
# share = '\\delivering-machine\pxreprise-share'
# run_root = "E:/pxreprise/runs"
# state_dir = "E:/pxreprise/state"

# REQUIRED. MetaMorpheus, by release. Download MetaMorpheus_CommandLine.zip for the release a profile names
# (1.1.11 for label-free-dda@2) from https://github.com/smith-chem-wisc/MetaMorpheus/releases/tag/1.1.11, unzip it
# anywhere, and point at CMD.dll (run as `dotnet CMD.dll`, any OS) or, on Windows, CMD.exe.
# This table must come LAST in the file.
[metamorpheus]
"1.1.11" = "D:/tools/MetaMorpheus-1.1.11/CMD.dll"

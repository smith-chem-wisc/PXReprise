# Example question: type 2 diabetes. It lives here only until the T2D project exists; then it moves into that
# project's folder, which is where a question belongs (PXReprise D2). Keywords and relevance rules follow the PRIDE
# census of 2026-09-27, so the two can be compared.
#
#   pxreprise census examples/t2d/question.toml --queue      # find and route deposits; writes work/queue.json
#   pxreprise batch run examples/t2d/question.toml --machine machines/my-machine.toml
question = "t2d"
description = "Type 2 diabetes across tissues and organisms (exploratory scope)"
profiles = ["label-free-dda@2", "tmt-dda@1"]

[discover]
keywords = ["type 2 diabetes", "type II diabetes", "T2D", "T2DM", "diabetes", "diabetic", "insulin resistance",
            "pancreatic islet", "islets", "beta cell", "prediabetes", "hyperglycemia", "glucose tolerance",
            "db/db", "ob/ob", "Zucker diabetic", "high-fat diet", "obesity", "metabolic syndrome", "NAFLD", "MASLD"]
# Empty: every organism, as the Python census counted. A real T2D question would list exact PRIDE spellings.
organisms = []

[relevance]
require_any = ["type (2|ii) diabet", "\\bt2dm?\\b", "diabetic", "insulin resistan", "prediabet", "db/db", "ob/ob",
               "zucker diabetic", "\\bzdf\\b", "goto-kakizaki", "hyperglyc", "glucose intoleran", "impaired glucose",
               "streptozotocin", "\\bislets?\\b", "beta[- ]cells?"]
exclude_if_any = ["type (1|i) diabet", "\\bt1dm?\\b", "autoimmune diabet", "\\bnod mice\\b"]
unless_any = ["type (2|ii) diabet", "\\bt2dm?\\b"]

# Relative paths are relative to this file.
[batch]
run_root = "work/runs"
state_dir = "work/state"
queue = "work/queue.json"

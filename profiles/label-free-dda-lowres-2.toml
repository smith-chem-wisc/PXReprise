# label-free-dda-lowres/2: label-free-dda-lowres/1 plus HCD read in the ion trap (PXR-A68, aging 072, 2026-10-11).
# A Fusion/Lumos/Eclipse "HCD-IT" method fragments by HCD and reads MS2 in the ion trap. /1 refuses such a file
# ("not a fragmentation MetaMorpheus can be told per file"; PXD057407: all 7 files measured, ~200,000 MS2 each). Here
# ion_trap_hcd searches it as DissociationType HCD with the low-res product tolerance below, written per file. A file that
# mixes ion-trap and Orbitrap MS2, or ion-trap CID and ion-trap HCD, is still refused. Everything else is /1's.
#
# From /1: label-free DDA whose MS2 is read in the ION TRAP (low resolution), e.g. CID on an LTQ Orbitrap
# or a Fusion/Lumos in ion-trap mode. 34 aging deposits were skipped as low_res_ms2 before this profile existed.
# The user, 2026-10-07: "Calibration of low res is still an open PR. Suggest no Gptmd. Just search against the xml for a
# while until calibration is merged." So: the Search task only, against the canonical agingPTM-v3 XML (which carries
# UniProt's and agingPTM's PTM annotations), no Calibration, no GPTMD. The batch never routes here from the screen: only
# a probe whose spectra fail ONLY low_res_ms2 under the question's earlier profile is re-checked here (v0.4.2).
# Fragmentation is written per file from the MS2 headers (D32 slice 1): ion-trap CID is searched as LowCID with the low-res
# product tolerance below (unconfirmed default; to be checked on the first searches). No spectral library: ion-trap
# spectra must never enter the Orbitrap-HCD libraries the other profiles build. Everything else is label-free-dda@5's.
id = "label-free-dda-lowres"
version = 2
status = "available"
description = "Label-free DDA with MS2 read in the ion trap; MetaMorpheus 1.1.12 Search only (no calibration, no GPTMD), LowCID or ion-trap HCD per file, FlashLFQ with MBR and an SDRF design; UniProt canonical proteomes with agingPTM-v3 sites"

[accepts]
acquisition = ["dda"]
labelling = ["label_free"]
instrument = ["orbitrap_hcd_only", "orbitrap_hybrid"]
file_types = [".raw"]

[engine]
chemistry = "deposit"
metamorpheus = "1.1.12"
tasks = ["Search"]
spectral_library = false
write_sdrf = true
fragmentation = "per_file"
low_res_product_tolerance = "±0.5000 Absolute"
ion_trap_hcd = true
timeout_h = 8

[databases.human]
proteome = "UP000005640_all_genecentric_2026_03_agingPTM-v3.xml"
taxon = 9606

[databases.mouse]
proteome = "UP000000589_all_genecentric_2026_03_agingPTM-v3.xml"
taxon = 10090

[databases.rat]
proteome = "UP000002494_all_genecentric_2026_03_agingPTM-v3.xml"
taxon = 10116

[contaminants]
file = "MetaMorpheusContaminants_NoUPS.xml"

[quant]
method = "flashlfq"
mbr = true
design = "sdrf"

[deposit]
whole = true
max_files = 120
probe = "probe_spread"
max_est_ms2 = 3_000_000
max_file_mb = 5000
defer_if_median_file_mb = 2200

[qc]
ms2_analyzer = "any"
min_fraction_orbitrap_hcd = 0   # no Orbitrap-HCD gate: that is what this profile is for
min_ms2 = 5000
excludable = ["too_few_ms2"]
max_excluded_frac = 0.10

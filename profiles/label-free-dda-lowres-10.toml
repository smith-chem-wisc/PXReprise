# label-free-dda-lowres/10 (2026-11-24): label-free-dda-lowres/9 with a spectral library of its own: engine.spectral_library
# and engine.ion_trap_library = true (decision 0092; the user, 2026-11-24: "make sure each fragmentation type is building
# and using a spectrum library"; "We should not co-mingle ion trap and orbitrap spectra"). Each search reads its chain
# (<organism>_ithcd for ion-trap HCD, which this profile searches as HCD at the low-res tolerance, <organism>_lowcid for
# CID) with neither library switch set, and PXReprise builds the next version from the search's PSMs; MetaMorpheus
# cannot write one for low-res MS2 (it would match fragments at every charge). Measured once (results/
# library-iontrap_2026-11-24 in the project): PXD031710 reading a one-deposit mouse_ithcd library, PSMs -0.2%, peptides
# -1.9%, protein groups +5.3%; the user: "we should just keep an eye on this" (G132).
#  - The databases stay agingPTM-v3 (D44: v4's and v9's added sites cost ion-trap searches PSMs), so this profile does
#    not move to UniProt 2026_04 with label-free-dda/16 and tmt-dda/7. Nothing else changes (the guard test checks it
#    line by line).
#
# label-free-dda-lowres/9 (D84, 2026-11-21): lowres/8 on MetaMorpheus 1.1.15, still on agingPTM-v3, with the search's
# identification filter set to the q-value notch at 1% and the design's curated SDRF passed to the search, as
# label-free-dda/15 (see its header for the filter, why it is the notch (D87), and the input SDRF).
#  - The databases stay agingPTM-v3, where D44 kept this profile "until measured otherwise" (v4's added sites cost an
#    ion-trap run 4% of its PSMs, PXD045821 under 1.1.12). Measured again in the 1.1.15 trial (2026-11-22): PXD031710,
#    18 ion-trap files, searched by this version on v3 and on v9. v9 lost on every identification count at the table's
#    1%: target PSMs 903,940 against 917,458 (-1.5%), peptidoforms -3.1%, base sequences -3.1%. Most of the gap is
#    hydroxylation (v3: 8,458 hydroxy-P and 1,558 hydroxy-K PSMs; v9 leaves those sites out); v9 found more phospho,
#    HexNAc and methylation PSMs. By the rule this version was written under, it ships on v3 (the user, 2026-11-22).
#    A later version measures again.
#  - IdentificationFilter and FilterThreshold go to the Search task, the only one this profile runs.
#  - The MS2 floor is lowered (D84, 2026-11-22): `[qc] min_ms2` is 2500, where every earlier version has 5000. A raw
#    file needs 2,500 MS2 spectra to pass QC; fewer is `too_few_ms2`. Thin but real files now pass, such as the late
#    fractions of a fractionated deposit (PXD016039's high-pH fractions hold 2,790 to 4,978). A deposit can still set its
#    own floor with `min_ms2` in `[exceptions]`.
#  - No per-file output: WriteMzId = false, as label-free-dda/15 (see its header).
#  - Match-between-runs transfers kept below a q-value of 5%: MbrFdrThreshold = 0.05, as label-free-dda/15 (see its
#    header). PXD000279, the ion-trap benchmark, is this profile's case: 27 of 143 files kept no transfer at 1%, 2 at 5%.
# Every other setting is /8's, whose notes follow.
#
# label-free-dda-lowres/8 (v0.4.42, 2026-11-08): lowres/7 plus the custom modification file and the NBF-Cl mapping that
# label-free-dda/14 ships (G40; the user, 2026-11-08: "lets do the custom modifications now"). A deposit's chemistry is
# read under the question's Orbitrap profile; when its probe files' MS2 is read in the ion trap, the probe sends it here
# with that chemistry. /7 models no custom modification, so an NBF-Cl deposit's probe search failed at every driver start
# ("ships no custom modifications": PXD048079 and PXD045806, Eclipse ion-trap MS2, 2026-11-07 and 11-08). NBF on C is
# searched VARIABLE, as under /14. /14's [chemistry_artifacts] stay out: they go only to GPTMD, which this profile does
# not run. A deposit without NBF-Cl is searched exactly as under /7. Every other setting is /7's, whose notes follow:
#
# label-free-dda-lowres/7 (v0.4.40, 2026-11-05): lowres/6 without MetaMorpheus's individual-file tables
# (WriteIndividualFiles = false), as label-free-dda/14 (see its header; the user, 2026-11-05: "yes turn it off"). Every
# other setting is /6's.
# label-free-dda-lowres/6: lowres/5 on MetaMorpheus 1.1.13 (v0.4.33; the user, 2026-10-28/29: switch the pipeline to the
# new release). Nothing may run 1.1.12 after v0.4.33: the engine's mzLib 1.0.596 keeps an SDRF's replicate gaps (#1426),
# which 1.1.13 quantifies (#2928) and 1.1.12 refuses. RespectCleavageBlockingModifications = true and WriteIndividualFiles =
# true as in label-free-dda@12 (see its header). The databases stay agingPTM-v3: v4's added sites cost an ion-trap run 4%
# of its PSMs (D44), and no ion-trap measurement of v5 or v6 exists. Every other setting is /5's.
# label-free-dda-lowres/5: label-free-dda-lowres/3, with HCD read in the ion trap taken as LowCID in the PROBE search
# only (v0.4.29, 2026-10-21). The full search is /3's: ion-trap HCD searched as HCD at the low-res product tolerance.
# - Why not /4 (LowCID in the probe and the search): its evidence was measured under the probe's settings (the OneMM
#   notch, ±20 ppm precursor, three species' databases, phospho/GG/acetyl variable), where HCD finds far less. In the
#   full search LowCID lost PSMs on every deposit searched both ways: PXD052631 41,562 -> 37,052 (-11%, 19 of 22 files
#   lower), PXD016430 759,981 -> 637,306 (-16%, all 44 files lower), PXD015170 121,034 -> 119,928 (-1%). One PXD016430
#   file: 3,300 PSMs as HCD under the probe's settings, 15,939 in /2's full search, 13,043 as LowCID in /4's.
# - Why LowCID in the probe: under the probe's settings a deposit of rapid ion-trap HCD scans can identify nothing as
#   HCD. /3's probe parked PXD022393 waiting_no_identifications (0 PSMs in 3 runs); as LowCID it passes (1,379 and 1,767
#   PSMs on two runs, 2026-10-21).
# - Its full search as HCD costs PXD022393 nothing that matters: three files under the full search's settings, each
#   alone, 8,627 PSMs and 5,242 peptides as HCD against 8,420 and 4,936 as LowCID (protein groups 1,670 and 1,759;
#   results/lowres5-test_2026-10-21). The probe's settings are what defeat HCD: 107 PSMs on one of those files there,
#   4,862 under the full search's.
# - A file that mixes ion-trap CID and ion-trap HCD is refused again, as under /3: one file gets one DissociationType.
# Profile key ion_trap_hcd_probe_lowcid (needs ion_trap_hcd and probe_search; not with ion_trap_hcd_lowcid). Everything
# else is /3's, whose notes follow unchanged:
#
# label-free-dda-lowres/3: label-free-dda-lowres/2 plus the probe search, and precursor and FlashLFQ windows wide enough
# for the precursor offset it measures (2026-10-17). This profile runs no Calibration task (the user, 2026-10-07: no
# calibration of low-res data until MetaMorpheus's low-res calibration is merged), yet /2 kept MetaMorpheus's ±5 ppm
# precursor window and FlashLFQ's 5 ppm, which assume calibrated masses.
# - PXD045821 (Orbitrap Fusion, MS1 in the Orbitrap, HCD read in the ion trap): its precursors are +8.7 ppm off, and /2
#   identified 0.37% of its spectra. One of its runs: 292 PSMs at 1% under /2's ±5 ppm, 17,268 at ±10, 18,268 at ±20.
#   FlashLFQ (mzLib FlashLfqEngine) keeps only XIC peaks within QuantifyPpmTol of the theoretical mass and corrects no
#   offset: at ±20 ppm it quantified 1,295 peptides at 5 ppm and 10,421 at 20 ppm.
# - A fixed ±20 ppm costs a deposit with no offset: a PXD015170 run (offset 0.0 ppm) lost 21% of its PSMs and 17% of its
#   peptides. So the window is set per deposit: precursor_window = "probe" takes the probe runs' median precursor
#   offsets (the probe takes precursors within ±20 ppm, uncalibrated) and searches with 5 ppm beyond the largest, rounded
#   up, at most ±20 ppm; MetaMorpheus's windows when none exceeds 2 ppm. Provenance records the offsets and the window.
# - The probe search is @7's: three probe files against every species database, with its parks (species, alkylation,
#   no identifications, an unstated enrichment). Ion-trap runs are searched in it with their per-file fragmentation.
# Everything else is /2's.
#
# From /2: HCD read in the ion trap (PXR-A68, aging 072). A Fusion/Lumos/Eclipse "HCD-IT" method fragments by HCD and
# reads MS2 in the ion trap; ion_trap_hcd searches it as DissociationType HCD with the low-res product tolerance below,
# written per file. A file that mixes ion-trap and Orbitrap MS2, or ion-trap CID and ion-trap HCD, is still refused.
#
# From /1: label-free DDA whose MS2 is read in the ION TRAP (low resolution), e.g. CID on an LTQ Orbitrap
# or a Fusion/Lumos in ion-trap mode. The Search task only, against the canonical agingPTM-v3 XML (which carries
# UniProt's and agingPTM's PTM annotations), no Calibration, no GPTMD. The batch never routes here from the screen: only
# a probe whose spectra fail ONLY low_res_ms2 under the question's earlier profile is re-checked here (v0.4.2).
# Fragmentation is written per file from the MS2 headers (D32 slice 1): ion-trap CID is searched as LowCID with the low-res
# product tolerance below. No spectral library: ion-trap spectra must never enter the Orbitrap-HCD libraries the other
# profiles build. Everything else is label-free-dda@5's.
id = "label-free-dda-lowres"
version = 10
status = "available"
description = "Label-free DDA with MS2 read in the ion trap; a probe search first (ion-trap HCD as LowCID there), then MetaMorpheus 1.1.15 Search only (cleavage-blocking modifications respected) (no calibration, no GPTMD) with precursor and FlashLFQ windows wide enough for the probe's measured offset, LowCID or ion-trap HCD per file, FlashLFQ with MBR and an SDRF design; its own ion-trap spectral library per fragmentation type, read by the search and built from its PSMs; UniProt canonical proteomes with agingPTM-v3 sites; no individual-file tables; NBF-Cl modelled by a shipped modification (G40); the q-value notch at 1% in every task; the curated SDRF passed to the search"

[accepts]
acquisition = ["dda"]
labelling = ["label_free"]
instrument = ["orbitrap_hcd_only", "orbitrap_hybrid"]
file_types = [".raw"]

[engine]
chemistry = "deposit"
custom_modifications = "PXReprise_custom_modifications_v2.txt"   # /8: label-free-dda/14's file (G40), under lists/
metamorpheus = "1.1.15"   # released 2026-11-21 at 0da8edeaf (D84)
tasks = ["Search"]
spectral_library = true   # decision 0092: its own ion-trap chain (ithcd, lowcid), read by the search
ion_trap_library = true   # and built by PXReprise from the search's PSMs (MetaMorpheus cannot write one for low-res MS2)
write_sdrf = true
input_sdrf = true
fragmentation = "per_file"
low_res_product_tolerance = "±0.5000 Absolute"
ion_trap_hcd = true
ion_trap_hcd_probe_lowcid = true   # v0.4.29: ion-trap HCD as LowCID in the probe search only
probe_search = true
precursor_window = "probe"
timeout_h = 8

[thiol_reagents]
# G40: a reagent the chemistry reads (ChemistryDetector) -> "Type\tIdWithMotif" in custom_modifications; variable.
"NBF-Cl" = "PXReprise\tNBF on C"

[databases.human]
proteome = "UP000005640_all_genecentric_2026_03_agingPTM-v3.xml"
taxon = 9606

[databases.mouse]
proteome = "UP000000589_all_genecentric_2026_03_agingPTM-v3.xml"
taxon = 10090

[databases.rat]
proteome = "UP000002494_all_genecentric_2026_03_agingPTM-v3.xml"
taxon = 10116

[contaminants]
file = "MetaMorpheusContaminants_NoUPS.xml"

[quant]
method = "flashlfq"
mbr = true
design = "sdrf"

[deposit]
whole = true
max_files = 120
probe = "probe_spread"
max_est_ms2 = 3_000_000
max_file_mb = 5000
defer_if_median_file_mb = 2200

[qc]
ms2_analyzer = "any"
min_fraction_orbitrap_hcd = 0   # no Orbitrap-HCD gate: that is what this profile is for
min_ms2 = 2500   # D84: 5000 in every earlier version
excludable = ["too_few_ms2"]
max_excluded_frac = 0.10

[metamorpheus_settings.all]
RespectCleavageBlockingModifications = true
IdentificationFilter = "QValueNotch"   # D87: the q-value notch at 1%, in every task (the PEP q-value can fail at protein level)
FilterThreshold = 0.01

[metamorpheus_settings.search]
WriteIndividualFiles = false   # /7: as label-free-dda/14 (was true in /6)
WriteMzId = false              # /9: no per-file mzIdentML, as label-free-dda/15
MbrFdrThreshold = 0.05         # /9: transfers kept below a q-value of 5%, as label-free-dda/15

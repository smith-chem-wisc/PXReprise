# label-free-dda/3: label-free-dda/1 (aging's PTM-annotated databases) with the deposit's own chemistry (G19). Every other
# setting is /1's. /2 is the plain-UniProt variant for new questions. Changing a value here makes a NEW version.
# label-free-dda/1: the aging pipeline's v1, as it searched the aging corpus (aging pipeline/params.json and
# instance/batch_runner.py at b1e2140, 2026-09-27). Changing a value here makes a NEW version (label-free-dda/2);
# results already searched keep the version that produced them (push forward, aging D41).
id = "label-free-dda"
version = 3
status = "available"
description = "Label-free DDA, high-resolution HCD with MS2 read in the Orbitrap; MetaMorpheus 1.1.11 Calibrate/GPTMD/Search, FlashLFQ with MBR; protease and cysteine chemistry read from each deposit"

[accepts]
acquisition = ["dda"]
labelling = ["label_free"]
# Hybrids MAY read MS2 in the ion trap, so QC checks the files (aging S37: PXD060431). Astral MS2 is not the Orbitrap.
instrument = ["orbitrap_hcd_only", "orbitrap_hybrid"]
file_types = [".raw"]

[engine]
# G19 (D22-D27): each deposit's protease and cysteine chemistry are read first (curated SDRF, deposited SDRF, PRIDE
# identified PTMs / quantification, protocol text) and searched with, or the deposit waits. /1's searches stay /1's.
chemistry = "deposit"
metamorpheus = "1.1.11"
tasks = ["Calibration", "Gptmd", "Search"]
gptmd_extra_mods = ["Trypsin Digested\tGG (Ubiquitination Site) on K"]
spectral_library = true   # per organism, written then updated (aging D33)
timeout_h = 6

# Database FILE NAMES; the directory is machine configuration. The PTM-annotated proteomes are aging D59, placed in
# this shared profile by the user (PXReprise D3). The aging isoform database is NOT here: it is aging's overlay.
[databases.human]
proteome = "uniprotkb_proteome_UP000005640_AND_revi_2026_09_18_agingPTM-v1.xml"
taxon = 9606

[databases.mouse]
proteome = "uniprotkb_proteome_UP000000589_AND_revi_2026-09-22_agingPTM-v1.xml"
taxon = 10090

[databases.rat]
proteome = "uniprotkb_proteome_UP000002494_AND_revi_2026-09-22_agingPTM-v1.xml"
taxon = 10116

[contaminants]
panel = "MetaMorpheusContaminants.xml"
# The human spike-in standard removed (aging D54, S58): it is not a contaminant, and it hid native proteins.
exclude = "contaminant_panel_exclude_v1.tsv"

[quant]
method = "flashlfq"
mbr = true

[deposit]
whole = true              # every raw file or none (aging S43); more than max_files is deferred, never subsampled
max_files = 60
probe = "probe_spread"    # median by size plus first and last by name, never the smallest (aging G38)
max_est_ms2 = 1_500_000   # aging D58: larger searches wait on MetaMorpheus's FDR-engine fix
max_file_mb = 5000
defer_if_median_file_mb = 2200   # EBI drops very large transfers and a retry re-pays from zero (aging S40)

[qc]
ms2_analyzer = "orbitrap"
min_fraction_orbitrap_hcd = 0.9
min_ms2 = 5000
excludable = ["too_few_ms2"]   # a blank or failed injection may be excluded with a record (aging D52)
max_excluded_frac = 0.10

# tmt-dda/1: isobaric (TMT/iTRAQ) DDA on the Orbitrap. PENDING: MetaMorpheus searches TMT, but the engine needs the
# SDRF -> TmtDesign.txt path (mzLib #1375 -> #1380, MetaMorpheus #2853) and a failure check for a design MetaMorpheus
# could not use (a bad TmtDesign.txt only warns). Until then the census counts what this profile would unlock.
id = "tmt-dda"
version = 1
status = "pending"
description = "Isobaric-labelled DDA on the Orbitrap; MetaMorpheus 1.1.11 with reporter-ion quantification"

[accepts]
acquisition = ["dda"]
labelling = ["isobaric"]
instrument = ["orbitrap_hcd_only", "orbitrap_hybrid"]
file_types = [".raw"]

[engine]
metamorpheus = "1.1.11"
tasks = ["Calibration", "Gptmd", "Search"]
gptmd_extra_mods = ["Trypsin Digested\tGG (Ubiquitination Site) on K"]
spectral_library = true   # per organism, written then updated (aging D33)
timeout_h = 6

[databases.human]
proteome = "uniprotkb_proteome_UP000005640_AND_revi_2026_09_18_agingPTM-v1.xml"
taxon = 9606

[databases.mouse]
proteome = "uniprotkb_proteome_UP000000589_AND_revi_2026-09-22_agingPTM-v1.xml"
taxon = 10090

[databases.rat]
proteome = "uniprotkb_proteome_UP000002494_AND_revi_2026-09-22_agingPTM-v1.xml"
taxon = 10116

[contaminants]
panel = "MetaMorpheusContaminants.xml"
exclude = "contaminant_panel_exclude_v1.tsv"

[quant]
method = "reporter_ion"
mbr = false

[deposit]
whole = true
max_files = 60
probe = "probe_spread"
max_est_ms2 = 1_500_000
max_file_mb = 5000
defer_if_median_file_mb = 2200   # EBI drops very large transfers and a retry re-pays from zero (aging S40)

[qc]
ms2_analyzer = "orbitrap"
min_fraction_orbitrap_hcd = 0.9
min_ms2 = 5000
excludable = ["too_few_ms2"]
max_excluded_frac = 0.10
